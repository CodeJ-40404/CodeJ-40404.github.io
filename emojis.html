<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Emoji 八角笼 · 斗蛐蛐</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(circle at 50% 0%, #15152c 0%, #06060c 65%);
  color: #e8e8f2;
  font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app { display: flex; height: 100%; }

#stage { flex: 1 1 auto; position: relative; min-width: 0; }
#cv { display: block; width: 100%; height: 100%; }

#panel {
  flex: 0 0 348px; max-width: 348px; height: 100%;
  overflow-y: auto; padding: 18px 16px 30px;
  background: rgba(11,11,20,0.9);
  border-left: 1px solid rgba(120,150,255,0.16);
  backdrop-filter: blur(10px);
}
#panel::-webkit-scrollbar { width: 6px; }
#panel::-webkit-scrollbar-thumb { background: rgba(120,150,255,0.25); border-radius: 3px; }

h1 {
  font-size: 19px; letter-spacing: 2px; margin: 0 0 4px;
  background: linear-gradient(90deg,#7ea8ff,#ff7ab6,#ffd93d);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-weight: 800;
}
.sub { font-size: 11.5px; color: #7a7f9c; margin: 0 0 16px; line-height: 1.5; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

.card {
  position: relative; cursor: pointer; user-select: none;
  border-radius: 12px; padding: 10px 8px 8px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.07);
  transition: transform .13s ease, border-color .13s, background .13s, box-shadow .13s;
  text-align: center;
}
.card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.16); }
.card .emoji { font-size: 30px; line-height: 1.15; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
.card .nm { font-size: 12.5px; font-weight: 700; margin-top: 4px; }
.card .tt { font-size: 10px; color: #767b96; margin-top: 1px; }
.card .st { display: flex; justify-content: center; gap: 6px; margin-top: 3px; font-size: 9.5px; color: #8a90ad; letter-spacing: .2px; }
.card .grp {
  position: absolute; top: 5px; left: 6px;
  font-size: 8.5px; font-weight: 700; line-height: 1;
  padding: 2px 4px; border-radius: 5px;
  color: #ffd93d; background: rgba(255,217,61,.13);
  border: 1px solid rgba(255,217,61,.22);
}
.card.sel {
  border-color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  box-shadow: 0 0 0 1px var(--c), 0 0 22px -6px var(--c);
}
.card.sel::after {
  content: attr(data-slot);
  position: absolute; top: 5px; right: 6px;
  min-width: 16px; height: 16px; padding: 0 3px;
  border-radius: 8px; text-align: center;
  background: var(--c); color: #08080f;
  font-size: 10px; font-weight: 800; line-height: 16px;
}

.actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }

/* 角色图鉴 */
details.codex {
  margin-top: 14px; padding: 10px 12px;
  border: 1px solid rgba(120,150,255,0.18); border-radius: 12px;
  background: rgba(255,255,255,0.03);
}
details.codex summary {
  list-style: none; cursor: pointer; outline: none;
  font-size: 12.5px; font-weight: 700; letter-spacing: 1px; color: #9db2e8;
}
details.codex summary::-webkit-details-marker { display: none; }
details.codex summary::before { content: '▸ '; }
details.codex[open] summary::before { content: '▾ '; }
.cdx { margin-top: 8px; padding-top: 9px; border-top: 1px dashed rgba(120,150,255,0.16); }
.cdx h4 { margin: 0 0 4px; font-size: 12.5px; color: #dfe3f5; }
.cdx .tag {
  margin-left: 5px; padding: 1px 5px; border-radius: 4px;
  font-size: 9.5px; font-weight: 700; color: #ffd93d;
  background: rgba(255,217,61,0.12);
}
.cdx p { margin: 2px 0; font-size: 10.5px; line-height: 1.55; color: #8b91ad; }
.cdx p b { color: #b9c2e0; font-weight: 600; }

button {
  font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 1px;
  padding: 12px; border-radius: 11px; border: 0; cursor: pointer;
  color: #08080f;
  background: linear-gradient(100deg,#8fb4ff,#c9a4ff 55%,#ffb3d1);
  transition: filter .15s, transform .1s, opacity .15s;
}
button:hover:not(:disabled) { filter: brightness(1.12); }
button:active:not(:disabled) { transform: scale(.985); }
button:disabled { opacity: .32; cursor: not-allowed; }
button.ghost {
  background: rgba(255,255,255,0.06);
  color: #b9bfd8; border: 1px solid rgba(255,255,255,0.12);
  font-weight: 600; font-size: 13px;
}

/* 机枪调参面板 */
.mg-mask {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(4,5,12,0.68); backdrop-filter: blur(4px);
}
.mg-mask.hidden { display: none; }
.mg-box {
  width: min(360px, 90vw); padding: 16px;
  border-radius: 14px; border: 1px solid rgba(255,184,77,0.35);
  background: #12121c; box-shadow: 0 18px 60px rgba(0,0,0,.7);
}
.mg-box h3 { margin: 0 0 8px; font-size: 15px; color: #ffd08a; letter-spacing: 1px; }
.mg-tip { font-size: 10.5px; color: #767b96; margin: 0 0 4px; line-height: 1.5; }
.mg-row { margin: 10px 0; }
.mg-row label { display: flex; justify-content: space-between; font-size: 12px; color: #aab0c9; margin-bottom: 4px; }
.mg-row b { color: #ffb84d; font-variant-numeric: tabular-nums; }
.mg-row input[type=range] { width: 100%; accent-color: #ffb84d; }
.mg-actions { display: flex; gap: 8px; margin-top: 14px; }
.mg-actions button { flex: 1; font-size: 12.5px; padding: 9px; }

@media (max-width: 780px) {
  #app { flex-direction: column; }
  #stage { flex: 1 1 auto; min-height: 0; }
  #panel { flex: 0 0 auto; max-width: none; width: 100%; height: 46vh; border-left: 0;
           border-top: 1px solid rgba(120,150,255,0.16); padding: 12px 14px 22px; }
  .card .emoji { font-size: 24px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside id="panel">
    <h1>EMOJI 八角笼</h1>
    <p class="sub">选两名选手，看它们在笼子里飘来飘去地互殴<br><span style="opacity:.75">❤ 生命 · ⚔ 攻击 · ⚡ 速度 · 同名角色可连点两次</span></p>
    <div class="grid" id="grid"></div>
    <div class="actions">
      <button id="startBtn" disabled>开始战斗</button>
      <button id="randBtn" class="ghost">随机对战</button>
    </div>
    <details class="codex" id="codex">
      <summary>角色图鉴 · 新增角色配置</summary>
      <div id="codexList"></div>
    </details>
  </aside>
</div>

<div class="mg-mask hidden" id="mgMask">
  <div class="mg-box">
    <h3>🔫 机枪参数调试</h3>
    <p class="mg-tip">右键机枪卡片打开；调整后点“应用”，下一局生效。</p>
    <div class="mg-row">
      <label>一次性弹量 <b id="mgAmmoVal">300 发</b></label>
      <input type="range" id="mgAmmo" min="1" max="20000" step="1" value="300">
    </div>
    <div class="mg-row">
      <label>装填时间 <b id="mgReloadVal">30 秒</b></label>
      <input type="range" id="mgReload" min="0.5" max="60" step="0.5" value="30">
    </div>
    <div class="mg-row">
      <label>血量 <b id="mgHpVal">118</b></label>
      <input type="range" id="mgHp" min="40" max="5000" step="10" value="118">
    </div>
    <div class="mg-row">
      <label>射速 <b id="mgRateVal">29 发/秒</b></label>
      <input type="range" id="mgRate" min="1" max="5000" step="1" value="29">
    </div>
    <div class="mg-actions">
      <button class="ghost" id="mgReset">恢复默认</button>
      <button id="mgApply">应用</button>
    </div>
  </div>
</div>

<div class="mg-mask hidden" id="heroMask">
  <div class="mg-box">
    <h3>🦸 超人出拳调试</h3>
    <p class="mg-tip">右键超人卡片打开；调整后点“应用”，下一局生效。</p>
    <div class="mg-row">
      <label>出拳速度 <b id="heroRateVal">6.7 拳/秒</b></label>
      <input type="range" id="heroRate" min="1" max="100" step="0.5" value="6.7">
    </div>
    <div class="mg-actions">
      <button class="ghost" id="heroReset">恢复默认</button>
      <button id="heroApply">应用</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   基础工具
============================================================ */
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ============================================================
   八角笼几何
   顶点角度：22.5° + i*45°，内切圆半径 = R * cos(22.5°)
============================================================ */
const OCT_INSET = Math.cos(Math.PI / 8);
const arena = { cx: 0, cy: 0, R: 0 };

function octagonPath(R) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 8 + i * Math.PI / 4;
    const x = arena.cx + R * Math.cos(a);
    const y = arena.cy + R * Math.sin(a);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

/* 点到直线的符号（用于检测是否跨过铅笔线） */
function segSide(px, py, x1, y1, x2, y2) {
  return (px - x1) * (y2 - y1) - (py - y1) * (x2 - x1);
}

/* 求经过某点、方向为 ang 的直线与八角笼边缘的两个交点 */
function chordThroughPoint(px, py, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let tMin = Infinity, tMax = -Infinity;
  for (let i = 0; i < 8; i++) {
    const a1 = Math.PI / 8 + i * Math.PI / 4;
    const a2 = a1 + Math.PI / 4;
    const ax = arena.cx + arena.R * Math.cos(a1), ay = arena.cy + arena.R * Math.sin(a1);
    const bx = arena.cx + arena.R * Math.cos(a2), by = arena.cy + arena.R * Math.sin(a2);
    const ex = bx - ax, ey = by - ay;
    const den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-6) continue;
    const t = ((ax - px) * ey - (ay - py) * ex) / den;
    const u = ((ax - px) * dy - (ay - py) * dx) / den;
    if (u >= -0.001 && u <= 1.001) {
      if (t < tMin) tMin = t;
      if (t > tMax) tMax = t;
    }
  }
  if (!isFinite(tMin) || !isFinite(tMax) || tMin === tMax) return null;
  return {
    x1: px + dx * tMin, y1: py + dy * tMin,
    x2: px + dx * tMax, y2: py + dy * tMax
  };
}

/* 把一个对象约束在八角笼内（凸多边形，逐边推出） */
function clampToArena(o, pad) {
  const margin = pad != null ? pad : (o.size || 0) * 0.46;
  const dmax = arena.R * OCT_INSET - margin;
  for (let i = 0; i < 8; i++) {
    const a = (i + 1) * Math.PI / 4;
    const nx = Math.cos(a), ny = Math.sin(a);
    const proj = (o.x - arena.cx) * nx + (o.y - arena.cy) * ny;
    if (proj > dmax) {
      const push = proj - dmax;
      o.x -= nx * push;
      o.y -= ny * push;
      if (o.vx !== undefined) {
        const vn = o.vx * nx + o.vy * ny;
        if (vn > 0) { o.vx -= nx * vn * 2; o.vy -= ny * vn * 2; }
      }
    }
  }
}

/* ============================================================
   角色定义
   每个角色：think(f, foe, dt, G) 内自行决定移动方向与攻击
============================================================ */
const CHARS = [
  /* ---------- 1. 黄豆人 ---------- */
  {
    id: 'soy', emoji: '😀', name: '黄豆人', title: '经典 · 均衡', group: 'soy',
    color: '#ffd93d', hp: 120, speed: 152, size: 38, atkCd: 0.72, dmg: 8,
    desc: '最经典的选手。飘忽不定地游走，不停投掷会弹跳的黄豆。',
    think(f, foe, dt, G) {
      f.wt -= dt;
      if (f.wt <= 0) { f.wt = rnd(0.4, 1.1); f.wa = rnd(0, TAU); }
      const d = Math.hypot(foe.x - f.x, foe.y - f.y) || 1;
      const ux = (foe.x - f.x) / d, uy = (foe.y - f.y) / d;
      const pref = 195;
      const k = d > pref + 70 ? 1.15 : d < pref - 70 ? -1.15 : 0;
      f.dirX = Math.cos(f.wa) + ux * k;
      f.dirY = Math.sin(f.wa) + uy * k;
      if (f.cd <= 0) {
        f.cd = f.def.atkCd;
        G.shoot(f, foe, { kind: 'pea', color: '#ffd93d', r: 9, speed: 340, dmg: f.def.dmg, life: 4.5, bounces: 4 });
      }
    }
  },

  /* ---------- 2. 暴怒者 ---------- */
  {
    id: 'rage', emoji: '😡', name: '暴怒者', title: '天降 · 范围重击', group: 'soy',
    color: '#ff4b3e', hp: 110, speed: 132, size: 38, atkCd: 3, dmg: 50,
    desc: '蓄势跃上高空，锁定对手所在位置后轰然砸落；判定圈内的敌人会受到50点重创。',
    trigger: '冷却结束且对手在480距离内时跃起，锁定当前位置生成判定圆圈；0.9秒后落地',
    interact: '落地时若对手仍在半径95的判定圈内，造成50点伤害并击飞；之后冷却3秒',
    think(f, foe, dt, G) {
      const d = Math.hypot(foe.x - f.x, foe.y - f.y) || 1;
      const ux = (foe.x - f.x) / d, uy = (foe.y - f.y) / d;

      /* 天降重击：升空 → 砸向锁定圆圈 */
      if (f.slamPhase > 0) {
        f.slamT -= dt;
        f.vx = 0; f.vy = 0;
        f.speedMul = 0;
        f.dirX = 0; f.dirY = 0;
        const progress = clamp(1 - f.slamT / 0.9, 0, 1);
        f.airH = Math.sin(progress * Math.PI);
        if (f.slamT <= 0) {
          f.slamPhase = 0;
          f.airH = 0;
          f.x = f.slamX;
          f.y = f.slamY;
          f.vx = 0; f.vy = 0;
          f.trail.length = 0;
          f.cd = 3;

          const dx = foe.x - f.slamX, dy = foe.y - f.slamY;
          const dist = Math.hypot(dx, dy) || 1;
          const hit = !foe.dead && dist <= 95 + foe.size * 0.25;
          G.impact(f.slamX, f.slamY, Math.PI / 2, '#ff4b3e', true);
          G.burst(f.slamX, f.slamY, '#ff4b3e', 30);
          G.burst(f.slamX, f.slamY, '#ffd93d', 16);
          G.waves.push({
            x: f.slamX, y: f.slamY, r: 14, maxR: 230, speed: 820,
            dmg: 0, owner: f, hit: false, noHit: true, color: '#ff4b3e'
          });
          G.shake = Math.max(G.shake, 30);
          if (hit) {
            G.damage(foe, 50, f);
            G.knock(foe, dx / dist, dy / dist, 380);
            G.text(foe.x, foe.y - foe.size * 0.95, '天降 50!', '#ff4b3e', 22);
          } else {
            G.text(f.slamX, f.slamY - 26, '落空!', '#ffd93d', 16);
          }
        }
        return;
      }

      /* 环绕游走 */
      f.wa += dt * 1.7;
      f.wt -= dt;
      if (f.wt <= 0) { f.wt = rnd(0.6, 1.4); f.wa += rnd(-0.7, 0.7); }
      const pref = 190;
      const distK = d > pref + 60 ? 1 : d < pref - 60 ? -1 : 0;
      f.dirX = -uy + ux * distK * 0.85;
      f.dirY = ux + uy * distK * 0.85;

      if (f.cd <= 0 && d < 480) {
        const lock = { x: foe.x + foe.vx * 0.18, y: foe.y + foe.vy * 0.18, size: f.size };
        clampToArena(lock);
        f.slamPhase = 1;
        f.slamT = 0.9;
        f.slamX = lock.x;
        f.slamY = lock.y;
        f.airH = 0;
        f.vx = 0; f.vy = 0;
        f.trail.length = 0;
        G.text(f.x, f.y - f.size * 0.8, '升空!', '#ff4b3e', 17);
        G.burst(f.x, f.y, '#ff4b3e', 14);
      }
    }
  },

  /* ---------- 3. 酷哥 ---------- */
  {
    id: 'cool', emoji: '😎', name: '酷哥', title: '防御 · 环绕', group: 'soy',
    color: '#4dd0ff', hp: 145, speed: 118, size: 38, atkCd: 9, dmg: 9, dr: 0.2,
    desc: '永远淡定。墨镜光球会随时间不断增多，并定期射出一枚追踪光球；贴身光球依然会弹飞敌人（减伤 20%）。',
    think(f, foe, dt, G) {
      const d = Math.hypot(foe.x - f.x, foe.y - f.y) || 1;
      const ux = (foe.x - f.x) / d, uy = (foe.y - f.y) / d;
      const o = f.orbitDir;
      f.dirX = -uy * o + ux * (d > 115 ? 0.8 : d < 70 ? -0.8 : 0);
      f.dirY = ux * o + uy * (d > 115 ? 0.8 : d < 70 ? -0.8 : 0);
      f.orbA += dt * 2.4;

      /* 轨道光球随时间增多，上限 6 颗 */
      if (f.orbitCount < 6) {
        f.orbGrowT -= dt;
        if (f.orbGrowT <= 0) {
          f.orbGrowT = 3;
          f.orbitCount++;
          G.burst(f.x, f.y, '#4dd0ff', 10);
          G.text(f.x, f.y - f.size * 0.9, `光球 +1 (${f.orbitCount})`, '#4dd0ff', 14);
        }
      }

      /* 每 4.5 秒发射一枚 30 伤害的追踪光球 */
      f.orbLaunchT -= dt;
      if (f.orbLaunchT <= 0 && !foe.dead) {
        f.orbLaunchT = 4.5;
        const a0 = f.orbA;
        const ox = f.x + Math.cos(a0) * f.orbR;
        const oy = f.y + Math.sin(a0) * f.orbR;
        const aa = Math.atan2(foe.y - oy, foe.x - ox);
        G.bullet(ox, oy, Math.cos(aa) * 320, Math.sin(aa) * 320, {
          kind: 'orb', color: '#4dd0ff', r: 11, speed: 320, dmg: 30,
          life: 5, homing: true, turn: 2.6
        }, f, foe);
        G.burst(ox, oy, '#4dd0ff', 12);
        G.text(ox, oy - 18, '光球出击!', '#4dd0ff', 14);
      }

      /* 贴身光球接触伤害 */
      if (f.orbCd > 0) f.orbCd -= dt;
      if (f.orbCd <= 0 && !foe.dead) {
        for (let i = 0; i < f.orbitCount; i++) {
          const a = f.orbA + i * TAU / f.orbitCount;
          const ox = f.x + Math.cos(a) * f.orbR;
          const oy = f.y + Math.sin(a) * f.orbR;
          if (Math.hypot(foe.x - ox, foe.y - oy) < foe.size * 0.45 + 18) {
            G.damage(foe, f.def.dmg, f);
            G.knock(foe, Math.cos(a), Math.sin(a), 320);
            G.burst(ox, oy, '#4dd0ff', 16);
            f.orbCd = 0.42;
            break;
          }
        }
      }
    }
  },

  /* ---------- 4. 骷髅 ---------- */
  {
    id: 'skull', emoji: '💀', name: '骷髅', title: '远程 · 三连',
    color: '#e8e8f0', hp: 95, speed: 140, size: 37, atkCd: 0.95, dmg: 7,
    desc: '保持距离，三连发骨弹。脆但射得准。',
    think(f, foe, dt, G) {
      const d = Math.hypot(foe.x - f.x, foe.y - f.y) || 1;
      const ux = (foe.x - f.x) / d, uy = (foe.y - f.y) / d;
      const pref = 290;
      const k = d < pref - 50 ? -1 : d > pref + 70 ? 0.75 : 0;
      f.dirX = -uy * 0.85 + ux * k;
      f.dirY = ux * 0.85 + uy * k;
      if (f.cd <= 0) {
        f.cd = f.def.atkCd;
        const base = Math.atan2(uy, ux);
        for (let i = -1; i <= 1; i++) {
          const a = base + i * 0.2;

/* ============================================================

============================================================ */
const G = {
  state: 'ready',       // ready | countdown | fight | over
  fighters: [],
  bullets: [],
  particles: [],
  floats: [],
  areas: [],
  waves: [],
  lines: [],
  slashes: [],
  webs: [],
  minions: [],
  strikes: [],
  bolts: [],
  smokes: [],
  lasers: [],
  tentacles: [],
  wells: [],
  mines: [],
  flash: 0,
  hits: [],
  booms: [],
  countdown: 0,
  overT: 0,
  winner: null,
  shake: 0,

  shoot(f, foe, o) {
    const a = Math.atan2(foe.y - f.y, foe.x - f.x);
    this.shootDir(f, Math.cos(a), Math.sin(a), o);
  },
  shootDir(f, dx, dy, o) {
    const sp = o.speed;
    this.bullet(f.x + dx * (f.size * 0.5 + 4), f.y + dy * (f.size * 0.5 + 4), dx * sp, dy * sp, o, f, f.foe);
  },

  bullet(x, y, vx, vy, o, owner, target) {
    const sp = o.speed;
    this.bullets.push({
      x, y, vx, vy,
      r: o.r, dmg: o.dmg, color: o.color,
      life: o.life != null ? o.life : 3,
      bounces: o.bounces || 0,
      kind: o.kind || 'ball',
      owner, target,
      speed: sp,
      homing: o.homing || false,
      turn: o.turn || 3,
      explode: !!o.explode,
      split: o.split || 0,
      firework: !!o.firework,
      slime: !!o.slime,
      web: !!o.web,
      poison: !!o.poison,
      slow: o.slow || 0,
      mark: o.mark || 0,
      frog: o.frog || 0,
      charm: o.charm || 0,
      sleep: o.sleep || 0,
      pin: o.pin || 0,
      rocket: !!o.rocket,
      dynamite: !!o.dynamite,
      smallBoom: !!o.smallBoom,
      lob: o.lob || 0,
      life0: o.life != null ? o.life : 3,
      curve: o.curve || 0,
      rot: rnd(0, TAU),
      trail: []
    });
  },

  damage(target, amount, source, opt) {
    if (!target || target.dead || this.state !== 'fight') return;

    if (!(opt && opt.reflect) && target.def.id === 'mirror' && source && source.foe === target) {
      const ratio = Math.min(0.6, 0.3 + (1 - target.hp / target.maxHp) * 0.3);
      if (Math.random() < ratio) {
        this.burst(target.x, target.y, '#c9a4ff', 22);
        this.text(target.x, target.y - target.size * 0.8, '反弹!', '#c9a4ff', 17);
        this.damage(source, amount, target, { reflect: true });
        return;
      }
    }

    if (target.markT > 0 && amount > 0) amount *= 1.4;
    if (target.sleepT > 0 && amount > 0) {
      target.sleepT = 0;
      this.text(target.x, target.y - target.size * 0.9, '惊醒!', '#ffe066', 15);
      this.burst(target.x, target.y, '#ffe066', 10);
    }

    const dr = target.def.dr || 0;
    let dmg = amount * (1 - dr);

    if (target.shield > 0 && dmg > 0 && !(opt && opt.pierce)) {
      const absorbed = Math.min(target.shield, dmg);
      target.shield -= absorbed;
      dmg -= absorbed;
      this.floats.push({
        x: target.x + rnd(-8, 8), y: target.y - target.size * 0.55,
        vy: -58, life: 0.8, maxLife: 0.8,
        text: '盾 -' + Math.round(absorbed),
        color: '#6fd3ff', size: 13
      });
      this.burst(target.x, target.y, '#6fd3ff', 6);
      if (target.shield <= 0) {
        target.shield = 0;
        if (target.def.shieldRegen) target.shieldCd = target.def.shieldRegen;
        this.text(target.x, target.y - target.size * 0.95, '护盾破碎!', '#8fdcff', 16);
        this.burst(target.x, target.y, '#aee6ff', 22);
      }
      if (dmg <= 0.001) {
        target.hitFlash = 0.6;
        return;
      }
    }

    target.hp = Math.max(0, target.hp - dmg);
    target.hitFlash = 1;
    this.floats.push({
      x: target.x + rnd(-10, 10), y: target.y - target.size * 0.5,
      vy: -62, life: 0.85, maxLife: 0.85,
      text: '-' + Math.round(dmg),
      color: opt && opt.poison ? '#7bd88f' : (dr > 0 ? '#8fd6ff' : '#ff6b6b'),
      size: opt && opt.poison ? 11 : 15 + Math.min(9, dmg * 0.45)
    });
    this.burst(target.x, target.y, target.def.color, 8);
    if (target.def.onHurt && !target.dead) target.def.onHurt(target, source, dmg, this);
    if (target.hp <= 0) this.endBattle(target);
  },

  text(x, y, text, color, size) {
    this.floats.push({
      x, y, vy: -58, life: 1.0, maxLife: 1.0,
      text, color, size: size || 16
    });
  },

  slash(x, y, a, color, r, width) {
    this.slashes.push({
      x, y, a, color, r: r || 80, width: width || 5,
      life: 0.24, maxLife: 0.24
    });
  },

  fireworkBurst(x, y) {
    const cols = ['#ff6ec7', '#ffd93d', '#5ce1a6', '#4dd0ff', '#ff8f5e', '#c9a4ff'];
    for (let i = 0; i < 4; i++) this.burst(x, y, cols[i], 9);
    this.burst(x, y, '#ffffff', 8);
    this.shake = Math.max(this.shake, 5);
  },

  /* 炸药爆炸：巨型烟花 + 彩色亮片 + 浓雾 */
  dynamiteBoom(x, y, owner) {
    const cols = ['#ff4b3e', '#ffd93d', '#4dd0ff', '#ff6ec7', '#8ce99a', '#c8b6ff', '#ffb84d', '#ffffff'];
    this.booms.push({ x, y, r: 150, life: 0.72, maxLife: 0.72 });
    this.booms.push({ x: x + rnd(-22, 22), y: y + rnd(-22, 22), r: 100, life: 0.52, maxLife: 0.52 });
    this.booms.push({ x: x + rnd(-32, 32), y: y + rnd(-32, 32), r: 72, life: 0.42, maxLife: 0.42 });

    for (let i = 0; i < 8; i++) {
      this.burst(x + rnd(-34, 34), y + rnd(-34, 34), cols[i % cols.length], 20);
    }
    /* 彩色亮片：带旋转的矩形碎片 */
    for (let i = 0; i < 84; i++) {
      const a = rnd(0, TAU), sp = rnd(60, 500);
      this.particles.push({
        x: x + rnd(-14, 14), y: y + rnd(-14, 14),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(1.1, 2.5), maxLife: 2.5,
        color: cols[i % cols.length],
        size: rnd(3, 7), rect: true, rot: rnd(0, TAU), spin: rnd(-11, 11), grav: 130
      });
    }
    /* 高速彩色火星 */
    for (let i = 0; i < 32; i++) {
      const a = rnd(0, TAU), sp = rnd(280, 620);
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.5, 1.1), maxLife: 1.1,
        color: cols[i % cols.length], size: rnd(1.8, 3.8), grav: 30
      });
    }
    /* 彩色烟雾与雾团 */
    for (let i = 0; i < 16; i++) {
      this.smokes.push({
        x: x + rnd(-40, 40), y: y + rnd(-40, 40),
        r: rnd(26, 52),
        vx: rnd(-20, 20), vy: rnd(-30, 6),
        life: rnd(1.8, 3.1), maxLife: 3.1,
        hue: rnd(0, 360)
      });
    }

    this.waves.push({
      x, y, r: 24, maxR: 290, speed: 950,
      dmg: 0, owner, hit: false, noHit: true, color: '#fff2cc'
    });
    this.waves.push({
      x, y, r: 14, maxR: 210, speed: 680,
      dmg: 0, owner, hit: false, noHit: true, color: '#ff6ec7'
    });
    this.shake = Math.max(this.shake, 36);
    this.flash = Math.max(this.flash, 0.85);

    const foe = owner ? owner.foe : null;
    if (this.state === 'fight' && foe && !foe.dead) {
      const dx = foe.x - x, dy = foe.y - y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 110 + foe.size * 0.2) {
        this.damage(foe, 20, owner);
        this.knock(foe, dx / d, dy / d, 330);
        this.text(foe.x, foe.y - foe.size * 0.95, '爆破 20!', '#ffd93d', 19);
      }
    }
  },

  /* 小炸药爆裂：紧凑烟花 */
  smallBoom(x, y, owner) {
    const cols = ['#ff4b3e', '#ffd93d', '#4dd0ff', '#ff6ec7', '#8ce99a', '#ffffff'];
    this.booms.push({ x, y, r: 74, life: 0.4, maxLife: 0.4 });
    this.booms.push({ x: x + rnd(-10, 10), y: y + rnd(-10, 10), r: 46, life: 0.3, maxLife: 0.3 });
    this.burst(x, y, '#ffd93d', 14);
    this.burst(x, y, '#ff6ec7', 10);
    for (let i = 0; i < 26; i++) {
      const a = rnd(0, TAU), sp = rnd(50, 300);
      this.particles.push({
        x: x + rnd(-8, 8), y: y + rnd(-8, 8),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.55, 1.2), maxLife: 1.2,
        color: cols[i % cols.length],
        size: rnd(2, 4.5), rect: true, rot: rnd(0, TAU), spin: rnd(-10, 10), grav: 120
      });
    }
    for (let i = 0; i < 5; i++) {
      this.smokes.push({
        x: x + rnd(-16, 16), y: y + rnd(-16, 16),
        r: rnd(14, 26), vx: rnd(-14, 14), vy: rnd(-20, 4),
        life: rnd(0.9, 1.6), maxLife: 1.6, hue: rnd(0, 360)
      });
    }
    this.waves.push({
      x, y, r: 10, maxR: 120, speed: 720,
      dmg: 0, owner, hit: false, noHit: true, color: '#ffd93d'
    });
    this.shake = Math.max(this.shake, 9);
    const foe = owner ? owner.foe : null;
    if (this.state === 'fight' && foe && !foe.dead) {
      const dx = foe.x - x, dy = foe.y - y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 64 + foe.size * 0.2) {
        this.damage(foe, 9, owner);
        this.knock(foe, dx / d, dy / d, 170);
        this.text(foe.x, foe.y - foe.size * 0.9, '小爆破 9!', '#ffd93d', 15);
      }
    }
  },

  impact(x, y, a, color, heavy) {
    this.hits.push({
      x, y, a, color, heavy: !!heavy,
      life: heavy ? 0.34 : 0.2,
      maxLife: heavy ? 0.34 : 0.2
    });
    this.burst(x, y, color, heavy ? 26 : 12);
    this.shake = Math.max(this.shake, heavy ? 24 : 7);
  },

  explodeRocket(x, y, owner) {
    this.booms.push({ x, y, r: 100, life: 0.55, maxLife: 0.55 });
    this.burst(x, y, '#ff8f5e', 26);
    this.burst(x, y, '#ffd93d', 18);
    this.burst(x, y, '#fff2cc', 10);
    for (let i = 0; i < 12; i++) {
      const a = rnd(0, TAU), sp = rnd(20, 110);
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.5, 1.0), maxLife: 1.0,
        color: '#6b6f7a', size: rnd(4, 9)
      });
    }
    this.waves.push({
      x, y, r: 10, maxR: 130, speed: 680,
      dmg: 0, owner, hit: false, noHit: true, color: '#ff8f5e'
    });
    this.shake = Math.max(this.shake, 13);

    const foe = owner && owner.foe;
    if (foe && !foe.dead && Math.hypot(foe.x - x, foe.y - y) < 70 + foe.size * 0.4) {
      const dx = foe.x - x, dy = foe.y - y;
      const d = Math.hypot(dx, dy) || 1;
      this.damage(foe, 4, owner);
      this.knock(foe, dx / d, dy / d, 240);
    }
  },

  knock(f, dx, dy, power) {
    if (f.dead) return;
    f.vx += dx * power;
    f.vy += dy * power;
  },

  burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), sp = rnd(50, 270);
      this.particles.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.35, 0.85), maxLife: 0.85,
        color, size: rnd(1.6, 4.2)
      });
    }
  },

  endBattle(loser) {
    if (this.state === 'over') return;
    loser.dead = true;
    loser.vx *= 0.3; loser.vy *= 0.3;
    loser.alpha = 1;
    this.winner = loser.foe;
    this.state = 'over';
    this.overT = 0;
    this.shake = 16;
    this.burst(loser.x, loser.y, loser.def.color, 46);
    this.burst(loser.x, loser.y, '#ffffff', 16);
    for (const f of this.fighters) f.alpha = 1;
    startBtn.textContent = '再来一局';
    startBtn.disabled = false;
  }
};

/* ============================================================
   Canvas 初始化
============================================================ */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

let W = 0, H = 0;

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width);
  H = Math.max(200, r.height);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  arena.cx = W / 2;
  arena.cy = H / 2;
  arena.R = Math.min(W, H) * 0.47;
  for (const f of G.fighters) clampToArena(f);
}
window.addEventListener('resize', resize);

/* ============================================================
   战斗流程
============================================================ */
const MG_DEFAULT = { ammo: 300, reload: 30, hp: 118, rate: 29 };
const MG_CFG = { ...MG_DEFAULT };

const HERO_DEFAULT = { rate: 6.7 };
const HERO_CFG = { ...HERO_DEFAULT };

function makeFighter(def, idx) {
  const f = {
    def, idx, foe: null,
    maxHp: def.hp, hp: def.hp,
    size: def.size || 38,
    x: 0, y: 0, vx: 0, vy: 0,
    dirX: 0, dirY: 0, speedMul: 1,
    cd: 0.7, t: rnd(0, 10), alpha: 1,
    hitFlash: 0, dead: false,
    trail: [],
    wt: 0, wa: rnd(0, TAU), jt: 0,
    dashT: 0, chargeT: 0, dashHit: false, dashX: 0, dashY: 0, dashLeft: 0,
    orbA: rnd(0, TAU), orbR: 88, orbCd: 0, orbitDir: Math.random() < 0.5 ? 1 : -1,
    orbitCount: 1, orbGrowT: 3, orbLaunchT: 4.5,
    st: 'visible', stT: rnd(1.2, 1.9),
    stunT: 0, stickT: 0,
    gunLeft: 6, gunT: 0, reloadT: 0,
    rushLeft: 0,
    axeT: 0, axeA: 0,
    shield: def.shieldMax || 0, shieldMax: def.shieldMax || 0, shieldCd: 0,
    poisonT: 0, poisonTick: 0, poisonBy: null,
    onWeb: false, combo: 0,
    mgLeft: 0, mgT: 0, mgReload: 0, rocketSide: 1, rocketAng: 0,
    mgAmmoMax: 300, mgReloadMax: 30, mgRate: 29, heroRate: 6.7,
    pinT: 0, pinX: 0, pinY: 0,
    slamPhase: 0, slamT: 0, slamX: 0, slamY: 0, airH: 0,
    crushT: 8, crushPhase: 0, crushA: 0, crushDashT: 0,
    tentacleCd: 4, latchT: 0, slowT: 0, laserCd: 0,
    markT: 0, charmT: 0, charmBy: null, sleepT: 0, sleepBy: null,
    frogT: 0, fearT: 0, fearX: 0, fearY: 0, cryCd: 0, confuseT: 0,
    holes: [], digT: rnd(0.5, 1.2), travelT: rnd(1.6, 2.6),
    arrowT: 15, trackT: 15, trackBoost: 0, trackUsed: false
  };
  if (def.id === 'machinegun') {
    f.maxHp = f.hp = MG_CFG.hp;
    f.mgAmmoMax = MG_CFG.ammo;
    f.mgReloadMax = MG_CFG.reload;
    f.mgRate = MG_CFG.rate;
  }
  if (def.id === 'hero') f.heroRate = HERO_CFG.rate;
  return f;
}

function startBattle(idA, idB) {
  const a = CHAR_MAP[idA], b = CHAR_MAP[idB];
  if (!a || !b) return;

  G.fighters = [makeFighter(a, 0), makeFighter(b, 1)];
  G.fighters[0].foe = G.fighters[1];
  G.fighters[1].foe = G.fighters[0];

  const off = arena.R * 0.52;
  G.fighters[0].x = arena.cx - off;
  G.fighters[0].y = arena.cy + (Math.random() - 0.5) * 40;
  G.fighters[1].x = arena.cx + off;
  G.fighters[1].y = arena.cy + (Math.random() - 0.5) * 40;
  G.fighters.forEach(f => clampToArena(f));

  G.bullets = [];
  G.particles = [];
  G.floats = [];
  G.areas = [];
  G.waves = [];
  G.lines = [];
  G.slashes = [];
  G.webs = [];
  G.minions = [];
  G.strikes = [];
  G.bolts = [];
  G.smokes = [];
  G.lasers = [];
  G.tentacles = [];
  G.wells = [];
  G.mines = [];
  G.flash = 0;
  G.hits = [];
  G.booms = [];
  G.winner = null;
  G.shake = 0;
  G.countdown = 3.15;
  G.state = 'countdown';
  startBtn.textContent = '战斗中…';
  startBtn.disabled = true;
}

/* ============================================================
   更新
============================================================ */
function pinToWall(tgt, seconds) {
  const dx = tgt.x - arena.cx, dy = tgt.y - arena.cy;
  const d = Math.hypot(dx, dy) || 1;
  const R = arena.R * OCT_INSET - tgt.size * 0.5;
  tgt.pinT = seconds;
  tgt.pinX = arena.cx + dx / d * R;
  tgt.pinY = arena.cy + dy / d * R;
  tgt.x = tgt.pinX;
  tgt.y = tgt.pinY;
  tgt.vx = 0; tgt.vy = 0;
  tgt.trail.length = 0;
  tgt.stickT = 0;
  G.burst(tgt.x, tgt.y, '#8ce99a', 24);
  G.waves.push({
    x: tgt.x, y: tgt.y, r: 10, maxR: 120, speed: 640,
    dmg: 0, owner: null, hit: false, noHit: true, color: '#8ce99a'
  });
  G.text(tgt.x, tgt.y - tgt.size * 0.9, `钉墙 ${seconds}s!`, '#8ce99a', 17);
  G.shake = Math.max(G.shake, 15);
}

function updateFighter(f, dt) {
  f.t += dt;
  f.hitFlash = Math.max(0, f.hitFlash - dt * 3.2);
  f.cd -= dt;
  if (f.stunT > 0) f.stunT = Math.max(0, f.stunT - dt);
  if (f.stickT > 0) f.stickT = Math.max(0, f.stickT - dt);
  if (f.slowT > 0) f.slowT = Math.max(0, f.slowT - dt);
  if (f.latchT > 0) f.latchT = Math.max(0, f.latchT - dt);
  if (f.markT > 0) f.markT = Math.max(0, f.markT - dt);
  if (f.charmT > 0) f.charmT = Math.max(0, f.charmT - dt);
  if (f.sleepT > 0) f.sleepT = Math.max(0, f.sleepT - dt);
  if (f.frogT > 0) f.frogT = Math.max(0, f.frogT - dt);
  if (f.fearT > 0) f.fearT = Math.max(0, f.fearT - dt);
  if (f.cryCd > 0) f.cryCd = Math.max(0, f.cryCd - dt);
  if (f.confuseT > 0) f.confuseT = Math.max(0, f.confuseT - dt);
  if (f.pinT > 0) {
    f.pinT = Math.max(0, f.pinT - dt);
    if (f.pinT === 0 && !f.dead) {
      G.burst(f.x, f.y, '#8ce99a', 14);
      G.text(f.x, f.y - f.size * 0.8, '挣脱!', '#8ce99a', 14);
    }
  }

  if (f.dead) {
    f.vx *= Math.pow(0.02, dt);
    f.vy *= Math.pow(0.02, dt);
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.alpha = Math.max(0.12, f.alpha - dt * 1.4);
    clampToArena(f);
    return;
  }

  f.speedMul = 1;
  f.alpha = 1;
  f.dirX = 0; f.dirY = 0;
  f.onWeb = false;

  if (G.state === 'fight' && f.poisonT > 0) {
    f.poisonT = Math.max(0, f.poisonT - dt);
    f.poisonTick -= dt;
    if (f.poisonTick <= 0) {
      f.poisonTick = 0.5;
      G.damage(f, 2, f.poisonBy, { reflect: true, poison: true });
      G.burst(f.x, f.y, '#7bd88f', 4);
    }
    if (f.dead) return;
  }

  /* 被毒刺钉在墙上：定身且无法行动 */
  if (f.pinT > 0) {
    f.x = f.pinX;
    f.y = f.pinY;
    f.vx = 0; f.vy = 0;
    f.alpha = 1;
    f.speedMul = 1;
    f.trail.length = 0;
    return;
  }

  const disabled = f.stunT > 0 || f.sleepT > 0 || f.charmT > 0 || f.frogT > 0 || f.fearT > 0;
  if (!disabled && G.state === 'fight') f.def.think(f, f.foe, dt, G);
  if (f.stickT > 0) f.speedMul *= 0.12;
  if (f.slowT > 0) f.speedMul *= 0.45;
  if (f.latchT > 0) f.speedMul *= 0.5;
  if (f.sleepT > 0) f.speedMul *= 0.05;
  if (f.frogT > 0) f.speedMul *= 0.45;
  if (f.charmT > 0) {
    const c = f.charmBy;
    if (c && !c.dead) {
      const dx = c.x - f.x, dy = c.y - f.y;
      const dd = Math.hypot(dx, dy) || 1;
      f.dirX = dx / dd;
      f.dirY = dy / dd;
    }
    f.speedMul *= 0.6;
  }
  if (f.fearT > 0) {
    const dx = f.x - f.fearX, dy = f.y - f.fearY;
    const dd = Math.hypot(dx, dy) || 1;
    f.dirX = dx / dd;
    f.dirY = dy / dd;
    f.speedMul *= 1.25;
  }
  /* 眩晕：方向颠倒 */
  if (f.confuseT > 0) {
    f.dirX = -f.dirX;
    f.dirY = -f.dirY;
  }

  for (const wb of G.webs) {
    if (wb.owner === f) continue;
    if (Math.hypot(f.x - wb.x, f.y - wb.y) < wb.r + f.size * 0.2) {
      f.speedMul *= 0.4;
      f.onWeb = true;
      break;
    }
  }

  const len = Math.hypot(f.dirX, f.dirY);
  let tx = 0, ty = 0;
  if (len > 0.001) {
    tx = f.dirX / len * f.def.speed * f.speedMul;
    ty = f.dirY / len * f.def.speed * f.speedMul;
  }
  const acc = 1 - Math.pow(0.0015, dt);
  f.vx += (tx - f.vx) * acc;
  f.vy += (ty - f.vy) * acc;
  f.x += f.vx * dt;
  f.y += f.vy * dt;

  clampToArena(f);

  const lastT = f.trail[f.trail.length - 1];
  if (lastT && Math.hypot(f.x - lastT.x, f.y - lastT.y) > 130) f.trail.length = 0;
  f.trail.push({ x: f.x, y: f.y });
  if (f.trail.length > 14) f.trail.shift();
}

function hitWall(b) {
  const dmax = arena.R * OCT_INSET - b.r;
  let hit = false;
  for (let i = 0; i < 8; i++) {
    const a = (i + 1) * Math.PI / 4;
    const nx = Math.cos(a), ny = Math.sin(a);
    const proj = (b.x - arena.cx) * nx + (b.y - arena.cy) * ny;
    if (proj > dmax) {
      b.x -= nx * (proj - dmax);
      b.y -= ny * (proj - dmax);
      const vn = b.vx * nx + b.vy * ny;
      if (vn > 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
      hit = true;
    }
  }
  return hit;
}

function updateBullets(dt) {
  for (const b of G.bullets) {
    if (b.dead) continue;
    b.life -= dt;
    if (b.life <= 0) {
      if (b.firework) {
        G.fireworkBurst(b.x, b.y);
        const ft = b.target;
        if (ft && !ft.dead && Math.hypot(ft.x - b.x, ft.y - b.y) < 78) {
          G.damage(ft, 4, b.owner);
        }
      }
      if (b.web) addWeb(b.x, b.y, b.owner);
      if (b.rocket) G.explodeRocket(b.x, b.y, b.owner);
      if (b.dynamite) {
        if (b.smallBoom) G.smallBoom(b.x, b.y, b.owner);
        else G.dynamiteBoom(b.x, b.y, b.owner);
      }
      b.dead = true;
      continue;
    }

    if (b.homing && b.target && !b.target.dead) {
      const dx = b.target.x - b.x, dy = b.target.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      const tx = dx / d * b.speed, ty = dy / d * b.speed;
      const t = Math.min(1, b.turn * dt);
      b.vx += (tx - b.vx) * t;
      b.vy += (ty - b.vy) * t;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      b.vx = b.vx / sp * b.speed;
      b.vy = b.vy / sp * b.speed;
    }

    if (b.rocket) {
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const ang = Math.atan2(b.vy, b.vx) + b.curve * dt;
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
      b.trailT = (b.trailT || 0) - dt;
      if (b.trailT <= 0) {
        b.trailT = 0.07;
        G.particles.push({
          x: b.x, y: b.y,
          vx: -b.vx * 0.06 + rnd(-16, 16),
          vy: -b.vy * 0.06 + rnd(-16, 16),
          life: 0.45, maxLife: 0.45,
          color: Math.random() < 0.35 ? '#ffd93d' : '#8b8f9c',
          size: rnd(2.4, 5.5)
        });
      }
    }

    if (b.dynamite) {
      b.trailT = (b.trailT || 0) - dt;
      if (b.trailT <= 0) {
        b.trailT = 0.035;
        G.particles.push({
          x: b.x, y: b.y - Math.sin(clamp(1 - b.life / b.life0, 0, 1) * Math.PI) * b.lob,
          vx: rnd(-18, 18), vy: rnd(-32, 4),
          life: 0.45, maxLife: 0.45,
          color: Math.random() < 0.5 ? '#ffd93d' : '#ff8f5e',
          size: rnd(1.8, 3.6)
        });
      }
    }

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 7) b.trail.shift();

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.rot += dt * 7;

    if (hitWall(b)) {
      if (b.bounces > 0) b.bounces--;
      else {
        b.dead = true;
        if (b.web) addWeb(b.x, b.y, b.owner);
        if (b.dynamite) {
          if (b.smallBoom) G.smallBoom(b.x, b.y, b.owner);
          else G.dynamiteBoom(b.x, b.y, b.owner);
        }
        else if (b.firework) G.fireworkBurst(b.x, b.y);
        else G.burst(b.x, b.y, b.color, 5);
        continue;
      }
    }

    const tgt = b.target;
    if (tgt && !tgt.dead) {
      const d = Math.hypot(tgt.x - b.x, tgt.y - b.y);
      if (d < tgt.size * 0.44 + b.r) {
        b.dead = true;
        if (b.dmg > 0) {
          G.damage(tgt, b.dmg, b.owner);
          const sp = Math.hypot(b.vx, b.vy) || 1;
          G.knock(tgt, b.vx / sp, b.vy / sp, Math.min(230, 90 + b.dmg * 8));
        }
        G.burst(b.x, b.y, b.color, 11);
        if (b.dynamite) {
          if (b.smallBoom) G.smallBoom(b.x, b.y, b.owner);
          else G.dynamiteBoom(b.x, b.y, b.owner);
        }
        if (b.firework) G.fireworkBurst(b.x, b.y);
        if (b.slime) {
          tgt.stickT = 5;
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '黏住!', '#8ce99a', 16);
          G.burst(tgt.x, tgt.y, '#8ce99a', 16);
        }
        if (b.web) {
          addWeb(tgt.x, tgt.y, b.owner);
        }
        if (b.poison) {
          tgt.poisonT = 5;
          tgt.poisonTick = Math.min(tgt.poisonTick > 0 ? tgt.poisonTick : 0.5, 0.5);
          tgt.poisonBy = b.owner;
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '中毒!', '#7bd88f', 15);
          G.burst(tgt.x, tgt.y, '#7bd88f', 12);
        }
        if (b.slow && !tgt.dead) {
          tgt.slowT = Math.max(tgt.slowT, b.slow);
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '墨囊减速!', '#8fd3ff', 14);
          G.burst(tgt.x, tgt.y, '#8fd3ff', 10);
        }
        if (b.mark && !tgt.dead) {
          tgt.markT = Math.max(tgt.markT, b.mark);
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '标记!', '#ffe066', 15);
          G.burst(tgt.x, tgt.y, '#ffe066', 12);
        }
        if (b.frog && !tgt.dead) {
          tgt.frogT = Math.max(tgt.frogT, b.frog);
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '变青蛙!', '#8ce99a', 16);
          G.burst(tgt.x, tgt.y, '#8ce99a', 18);
        }
        if (b.charm && !tgt.dead) {
          tgt.charmT = Math.max(tgt.charmT, b.charm);
          tgt.charmBy = b.owner;
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '心动!', '#ff6ec7', 16);
          G.burst(tgt.x, tgt.y, '#ff6ec7', 16);
        }
        if (b.sleep && !tgt.dead) {
          tgt.sleepT = Math.max(tgt.sleepT, b.sleep);
          tgt.sleepBy = b.owner;
          G.text(tgt.x, tgt.y - tgt.size * 0.7, '睡着了!', '#b39ddb', 16);
          G.burst(tgt.x, tgt.y, '#b39ddb', 16);
        }
        if (b.pin && !tgt.dead) pinToWall(tgt, b.pin);
        if (b.explode) {
          G.areas.push({
            x: b.x, y: b.y, r: 74, life: 3.0, maxLife: 3.0,
            owner: b.owner, tick: 0, dmg: 4.5, color: '#ff7a18'
          });
          G.burst(b.x, b.y, '#ffb74d', 20);
          G.shake = Math.max(G.shake, 5);
        }
        if (b.split > 0) {
          const baseA = Math.atan2(b.vy, b.vx);
          for (let i = 0; i < b.split; i++) {
            const a = baseA + (i - (b.split - 1) / 2) * 0.95;
            const sp = 235;
            G.bullet(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, {
              kind: 'mini', color: b.color, r: 6, dmg: 4, speed: sp, life: 1.6, bounces: 1
            }, b.owner, b.target);
          }
          G.burst(b.x, b.y, b.color, 10);
        }
      }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
}

function updateAreas(dt) {
  for (const ar of G.areas) {
    ar.life -= dt;
    ar.tick -= dt;
    if (ar.tick <= 0) {
      ar.tick = 0.45;
      const tgt = ar.owner.foe;
      if (tgt && !tgt.dead && Math.hypot(tgt.x - ar.x, tgt.y - ar.y) < ar.r + tgt.size * 0.3) {
        G.damage(tgt, ar.dmg, ar.owner);
      }
    }
    if (Math.random() < 0.5) {
      G.particles.push({
        x: ar.x + rnd(-ar.r * 0.7, ar.r * 0.7),
        y: ar.y + rnd(-ar.r * 0.5, ar.r * 0.5),
        vx: rnd(-15, 15), vy: rnd(-70, -25),
        life: rnd(0.3, 0.65), maxLife: 0.65,
        color: Math.random() < 0.5 ? '#ff7a18' : '#ffcf5c',
        size: rnd(1.5, 3.5)
      });
    }
  }
  G.areas = G.areas.filter(a => a.life > 0);
}

function updateWaves(dt) {
  for (const w of G.waves) {
    w.r += w.speed * dt;
    if (w.hit || w.noHit) continue;
    const tgt = w.owner.foe;
    if (!tgt || tgt.dead) continue;
    const dx = tgt.x - w.x, dy = tgt.y - w.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist <= w.r + tgt.size * 0.42) {
      w.hit = true;
      G.damage(tgt, w.dmg, w.owner);
      G.knock(tgt, dx / dist, dy / dist, 300);
      G.burst(tgt.x, tgt.y, w.color, 18);
      G.shake = Math.max(G.shake, 5);
    }
  }
  G.waves = G.waves.filter(w => w.r < w.maxR);
}

function updateLines(dt) {
  for (const ln of G.lines) {
    ln.life -= dt;
    const tgt = ln.owner.foe;
    if (tgt && !tgt.dead) {
      const side = segSide(tgt.x, tgt.y, ln.x1, ln.y1, ln.x2, ln.y2);
      if (ln.prevSide != null && side * ln.prevSide < 0) {
        G.damage(tgt, ln.dmg, ln.owner);
        G.burst(tgt.x, tgt.y, '#f2d16b', 14);
        G.text(tgt.x, tgt.y - tgt.size * 0.6, '划伤!', '#f2d16b', 14);
      }
      ln.prevSide = side || 0.001;
    }
  }
  G.lines = G.lines.filter(l => l.life > 0);
}

function addWeb(x, y, owner) {
  if (G.webs.length >= 3) G.webs.shift();
  G.webs.push({ x, y, r: 74, life: 8, maxLife: 8, owner, color: '#c8b6ff' });
  G.burst(x, y, '#c8b6ff', 12);
}

function updateWebs(dt) {
  for (const wb of G.webs) {
    wb.life -= dt;
    if (Math.random() < 0.16) {
      G.particles.push({
        x: wb.x + rnd(-wb.r * 0.8, wb.r * 0.8),
        y: wb.y + rnd(-wb.r * 0.6, wb.r * 0.6),
        vx: rnd(-12, 12), vy: rnd(-26, -8),
        life: rnd(0.3, 0.6), maxLife: 0.6,
        color: '#c8b6ff', size: rnd(1.2, 2.6)
      });
    }
  }
  G.webs = G.webs.filter(w => w.life > 0);
}

function updateMinions(dt) {
  for (const m of G.minions) {
    m.life -= dt;
    m.hitCd = Math.max(0, m.hitCd - dt);
    m.wob += dt * 9;
    if (m.life <= 0) {
      m.dead = true;
      G.burst(m.x, m.y, '#ffd93d', 8);
      continue;
    }
    const tgt = m.owner.foe;
    if (!tgt || tgt.dead) continue;

    const dx = tgt.x - m.x, dy = tgt.y - m.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    const sway = Math.sin(m.wob) * 70;
    const tvx = ux * 175 - uy * sway;
    const tvy = uy * 175 + ux * sway;
    const acc = 1 - Math.pow(0.004, dt);
    m.vx += (tvx - m.vx) * acc;
    m.vy += (tvy - m.vy) * acc;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    clampToArena(m);

    if (d < tgt.size * 0.5 + m.r && m.hitCd <= 0) {
      m.hitCd = 0.9;
      G.damage(tgt, 5, m.owner);
      G.knock(tgt, ux, uy, 90);
      G.burst(tgt.x, tgt.y, '#ffd93d', 10);
    }
  }
  G.minions = G.minions.filter(m => !m.dead);
}

function updateSlashes(dt) {
  for (const s of G.slashes) s.life -= dt;
  G.slashes = G.slashes.filter(s => s.life > 0);
}

/* 天使天雷：预警结束后落雷 */
function makeBolt(x, y) {
  const rng = a => rnd(-a, a);
  const pts = [{ x: x + rng(14), y: 0 }];
  for (let i = 1; i < 8; i++) {
    const t = i / 8;
    pts.push({ x: x + rng(26) * (1 - t * 0.6), y: (y - 0) * t });
  }
  pts.push({ x, y });
  const branches = [];
  for (let i = 2; i < pts.length - 2; i++) {
    if (Math.random() < 0.75) {
      const p = pts[i];
      branches.push([
        { x: p.x, y: p.y },
        { x: p.x + rng(46), y: p.y + rnd(15, 55) },
        { x: p.x + rng(70), y: p.y + rnd(45, 100) }
      ]);
    }
  }
  return { pts, branches, x, y, life: 0.32, maxLife: 0.32 };
}

function updateStrikes(dt) {
  if (!G.strikes.length) return;
  for (const s of G.strikes) {
    s.t -= dt;
    if (s.t > 0 || s.done) continue;
    s.done = true;
    const foe = s.owner ? s.owner.foe : null;
    if (G.state === 'fight' && foe && !foe.dead) {
      const dx = foe.x - s.x, dy = foe.y - s.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist <= s.r + foe.size * 0.2) {
        G.damage(foe, s.dmg, s.owner);
        foe.stunT = Math.max(foe.stunT, 0.45);
        G.knock(foe, dx / dist, dy / dist, 120);
        G.text(foe.x, foe.y - foe.size * 0.9, `雷击 ${s.dmg}!`, '#bfe9ff', 17);
      }
    }
    G.bolts.push(makeBolt(s.x, s.y));
    G.burst(s.x, s.y, '#bfe9ff', 24);
    G.burst(s.x, s.y, '#8fd3ff', 14);
    G.waves.push({
      x: s.x, y: s.y, r: 10, maxR: 100, speed: 720,
      dmg: 0, owner: s.owner, hit: false, noHit: true, color: '#8fd3ff'
    });
    G.shake = Math.max(G.shake, 16);
  }
  G.strikes = G.strikes.filter(s => !s.done);
}

function updateBolts(dt) {
  for (const b of G.bolts) b.life -= dt;
  G.bolts = G.bolts.filter(b => b.life > 0);
}

/* 机器人残血激光：充能 0.8 秒，随后持续 3 秒 */
function updateLasers(dt) {
  if (!G.lasers.length) return;
  for (const l of G.lasers) {
    l.life -= dt;
    if (!l.owner || l.owner.dead) {
      l.life = 0;
      continue;
    }
    l.x = l.owner.x;
    l.y = l.owner.y;
    if (l.fireT > 0) {
      l.fireT -= dt;
      if (l.fireT <= 0 && !l.fired) {
        l.fired = true;
        l.tickT = 0;
        G.flash = Math.max(G.flash, 0.5);
        G.shake = Math.max(G.shake, 24);
        G.burst(l.x + Math.cos(l.ang) * 34, l.y + Math.sin(l.ang) * 34, '#ff8f7e', 20);
      }
      continue;
    }

    l.tickT -= dt;
    const foe = l.owner ? l.owner.foe : null;
    if (G.state !== 'fight' || !foe || foe.dead) continue;
    const dx = foe.x - l.x, dy = foe.y - l.y;
    const along = dx * Math.cos(l.ang) + dy * Math.sin(l.ang);
    const perp = Math.abs(-dx * Math.sin(l.ang) + dy * Math.cos(l.ang));
    if (along > 0 && along < 1100 && perp < 20 + foe.size * 0.3 && l.tickT <= 0) {
      l.tickT = 0.25;
      G.damage(foe, 5, l.owner);
      G.knock(foe, Math.cos(l.ang), Math.sin(l.ang), 30);
      G.burst(foe.x, foe.y, '#ff6b5e', 7);
      G.burst(foe.x, foe.y, '#fff2e8', 4);
    }
  }
  G.lasers = G.lasers.filter(l => l.life > 0);
}

/* 章鱼触手：持续吸附、吸血并减速敌人 */
function updateTentacles(dt) {
  if (!G.tentacles.length) return;
  for (const t of G.tentacles) {
    t.life -= dt;
    const fo = t.owner, tg = t.target;
    if (!fo || !tg || fo.dead || tg.dead || Math.hypot(tg.x - fo.x, tg.y - fo.y) > 430) {
      t.life = 0;
      continue;
    }
    tg.latchT = Math.max(tg.latchT, 0.25);
    t.tickT -= dt;
    t.healTextT -= dt;
    if (t.tickT <= 0) {
      t.tickT = 0.25;
      if (G.state === 'fight') {
        G.damage(tg, 2, fo);
        fo.hp = Math.min(fo.maxHp, fo.hp + 2);
        G.burst(tg.x, tg.y, '#ff6ec7', 3);
        G.burst(fo.x, fo.y, '#7bffb0', 2);
        if (t.healTextT <= 0) {
          t.healTextT = 0.5;
          G.text(fo.x, fo.y - fo.size * 0.8, '+2', '#7bffb0', 12);
        }
      }
    }
  }
  G.tentacles = G.tentacles.filter(t => t.life > 0);
}

/* 外星人引力奇点 */
function updateWells(dt) {
  if (!G.wells.length) return;
  for (const w of G.wells) {
    w.life -= dt;
    const foe = w.owner ? w.owner.foe : null;
    if (foe && !foe.dead) {
      const dx = w.x - foe.x, dy = w.y - foe.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < w.r + foe.size * 0.2) {
        const pull = w.pull === undefined ? 150 : w.pull;
        if (pull > 0) {
          foe.x += (dx / d) * pull * dt;
          foe.y += (dy / d) * pull * dt;
          clampToArena(foe, 0);
        }
        if (w.slow) foe.slowT = Math.max(foe.slowT, 0.6);
        if (w.poison) {
          foe.poisonT = Math.max(foe.poisonT, 1.2);
          foe.poisonTick = Math.min(foe.poisonTick > 0 ? foe.poisonTick : 0.5, 0.5);
          foe.poisonBy = w.owner;
        }
        w.tickT -= dt;
        if (w.tickT <= 0 && G.state === 'fight') {
          w.tickT = 0.5;
          const tickDmg = w.tick === undefined ? 3 : w.tick;
          if (tickDmg > 0) {
            G.damage(foe, tickDmg, w.owner);
            G.burst(foe.x, foe.y, w.color || '#8ce99a', 5);
          }
        }
      }
    }
    if (w.life <= 0 && !w.boom) {
      w.boom = true;
      if (G.state === 'fight' && foe && !foe.dead) {
        const d = Math.hypot(foe.x - w.x, foe.y - w.y);
        if (d < w.r + foe.size * 0.2) {
          const burstDmg = w.burst === undefined ? 10 : w.burst;
          if (burstDmg > 0) {
            G.damage(foe, burstDmg, w.owner);
            G.knock(foe, (foe.x - w.x) / (d || 1), (foe.y - w.y) / (d || 1), 240);
            G.text(foe.x, foe.y - foe.size * 0.9, (w.label || '奇点爆发') + ' ' + burstDmg + '!', w.color || '#8ce99a', 16);
          }
        }
      }
      G.burst(w.x, w.y, w.color || '#8ce99a', 26);
      G.burst(w.x, w.y, w.accent || '#c9a4ff', 16);
      G.waves.push({
        x: w.x, y: w.y, r: 16, maxR: 180, speed: 720,
        dmg: 0, owner: w.owner, hit: false, noHit: true, color: w.color || '#8ce99a'
      });
      G.shake = Math.max(G.shake, w.shake === undefined ? 18 : w.shake);
    }
  }
  G.wells = G.wells.filter(w => !w.boom && w.life > 0);
}

/* 南瓜地雷 */
function updateMines(dt) {
  if (!G.mines.length) return;
  for (const m of G.mines) {
    m.life -= dt;
    m.armT -= dt;
    const foe = m.owner ? m.owner.foe : null;
    if (m.armT <= 0 && foe && !foe.dead && G.state === 'fight'
      && Math.hypot(foe.x - m.x, foe.y - m.y) < 62 + foe.size * 0.2) {
      m.dead = true;
      const dx = foe.x - m.x, dy = foe.y - m.y;
      const d = Math.hypot(dx, dy) || 1;
      G.damage(foe, 14, m.owner);
      G.knock(foe, dx / d, dy / d, 420);
      foe.fearT = Math.max(foe.fearT, 1.5);
      foe.fearX = m.x;
      foe.fearY = m.y;
      G.burst(m.x, m.y, '#ff8f5e', 26);
      G.burst(m.x, m.y, '#ffd93d', 14);
      G.waves.push({
        x: m.x, y: m.y, r: 12, maxR: 150, speed: 700,
        dmg: 0, owner: m.owner, hit: false, noHit: true, color: '#ff8f5e'
      });
      G.shake = Math.max(G.shake, 16);
      G.text(foe.x, foe.y - foe.size * 0.9, '惊吓!', '#ffd93d', 16);
    }
  }
  G.mines = G.mines.filter(m => !m.dead && m.life > 0);
}

function updateHits(dt) {
  for (const h of G.hits) h.life -= dt;
  G.hits = G.hits.filter(h => h.life > 0);
}

function updateBooms(dt) {
  for (const b of G.booms) b.life -= dt;
  G.booms = G.booms.filter(b => b.life > 0);
}

function updateParticles(dt) {
  for (const p of G.particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.06, dt);
    p.vy *= Math.pow(0.06, dt);
    p.vy += (p.grav || 60) * dt;
    if (p.rect) p.rot += p.spin * dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);

  for (const s of G.smokes) {
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= Math.pow(0.3, dt);
    s.vy *= Math.pow(0.5, dt);
    s.r += 26 * dt;
  }
  G.smokes = G.smokes.filter(s => s.life > 0);

  for (const fl of G.floats) {
    fl.life -= dt;
    fl.y += fl.vy * dt;
    fl.vy *= Math.pow(0.2, dt);
  }
  G.floats = G.floats.filter(f => f.life > 0);
}

function update(dt) {
  G.shake *= Math.pow(0.005, dt);
  if (G.shake < 0.2) G.shake = 0;

  if (G.state === 'countdown') {
    G.countdown -= dt;
    if (G.countdown <= 0) {
      G.state = 'fight';
      startBtn.textContent = '重新开始';
      startBtn.disabled = false;
    }
  } else if (G.state === 'over') {
    G.overT += dt;
  }

  for (const f of G.fighters) updateFighter(f, dt);

  if (G.state === 'fight' || G.state === 'over') {
    updateBullets(dt);
    updateAreas(dt);
    updateWaves(dt);
    updateLines(dt);
    updateWebs(dt);
    updateMinions(dt);
    updateStrikes(dt);
  }
  updateSlashes(dt);
  updateBolts(dt);
  updateLasers(dt);
  updateTentacles(dt);
  updateWells(dt);
  updateMines(dt);
  updateHits(dt);
  updateBooms(dt);
  updateParticles(dt);
  G.flash = Math.max(0, G.flash - dt * 2.2);
}

/* ============================================================
   渲染
============================================================ */
function drawArena() {
  octagonPath(arena.R);
  const grd = ctx.createRadialGradient(arena.cx, arena.cy, 8, arena.cx, arena.cy, arena.R);
  grd.addColorStop(0, '#1d1d33');
  grd.addColorStop(0.65, '#12121f');
  grd.addColorStop(1, '#08080f');
  ctx.fillStyle = grd;
  ctx.fill();

  ctx.save();
  octagonPath(arena.R);
  ctx.clip();

  ctx.strokeStyle = 'rgba(120,150,255,0.075)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    octagonPath(arena.R * i / 4);
    ctx.stroke();
  }
  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 8 + i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(arena.cx, arena.cy);
    ctx.lineTo(arena.cx + arena.R * Math.cos(a), arena.cy + arena.R * Math.sin(a));
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(120,150,255,0.14)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(arena.cx, arena.cy, arena.R * 0.14, 0, TAU);
  ctx.stroke();

  ctx.restore();

  octagonPath(arena.R);
  ctx.strokeStyle = 'rgba(130,165,255,0.9)';
  ctx.lineWidth = 4;
  ctx.shadowColor = 'rgba(90,140,255,0.9)';
  ctx.shadowBlur = 24;
  ctx.stroke();
  ctx.shadowBlur = 0;

  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 8 + i * Math.PI / 4;
    const x = arena.cx + arena.R * Math.cos(a);
    const y = arena.cy + arena.R * Math.sin(a);
    ctx.beginPath();
    ctx.arc(x, y, 6.5, 0, TAU);
    ctx.fillStyle = '#6f8dff';
    ctx.shadowColor = '#5b7cff';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawAreas() {
  for (const ar of G.areas) {
    const k = ar.life / ar.maxLife;
    const g2 = ctx.createRadialGradient(ar.x, ar.y, 4, ar.x, ar.y, ar.r);
    g2.addColorStop(0, `rgba(255,220,120,${0.42 * k})`);
    g2.addColorStop(0.45, `rgba(255,120,24,${0.3 * k})`);
    g2.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(ar.x, ar.y, ar.r, 0, TAU);
    ctx.fill();
  }
}

function drawWaves() {
  for (const w of G.waves) {
    const k = clamp(1 - w.r / w.maxR, 0, 1);
    ctx.save();
    ctx.shadowColor = w.color;
    ctx.shadowBlur = 20;
    ctx.globalAlpha = 0.75 * k;
    ctx.strokeStyle = w.color;
    ctx.lineWidth = 1.5 + 5 * k;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.55 * k;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r * 0.93, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawWebs() {
  for (const wb of G.webs) {
    const fade = clamp(wb.life / 1.2, 0, 1);
    ctx.save();
    ctx.translate(wb.x, wb.y);
    ctx.globalAlpha = 0.16 * fade;
    ctx.fillStyle = wb.color;
    ctx.beginPath();
    ctx.arc(0, 0, wb.r, 0, TAU);
    ctx.fill();

    ctx.globalAlpha = 0.78 * fade;
    ctx.strokeStyle = wb.color;
    ctx.lineWidth = 1.7;
    for (let i = 0; i < 8; i++) {
      const a = i * TAU / 8 + 0.2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * wb.r, Math.sin(a) * wb.r);
      ctx.stroke();
    }
    for (let ring = 1; ring <= 3; ring++) {
      const rr = wb.r * ring / 3;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * TAU / 8 + 0.2;
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    ctx.globalAlpha = 0.85 * fade;
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, wb.r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.globalAlpha = 0.6 * fade;
    ctx.font = `26px ${EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🕸️', 0, 1);
    ctx.restore();
  }
}

function drawShields() {
  for (const f of G.fighters) {
    if (f.dead || f.shield <= 0) continue;
    const k = clamp(f.shield / (f.shieldMax || 1), 0, 1);
    const rot = f.t * 0.9;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.globalAlpha = 0.35 + k * 0.45;
    ctx.strokeStyle = '#6fd3ff';
    ctx.lineWidth = 2.2;
    ctx.shadowColor = '#6fd3ff';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = rot + i * TAU / 6;
      const x = Math.cos(a) * f.size * 0.78;
      const y = Math.sin(a) * f.size * 0.78;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.08 + k * 0.1;
    ctx.fillStyle = '#6fd3ff';
    ctx.fill();
    ctx.restore();
  }
}

function drawMinions() {
  for (const m of G.minions) {
    const fade = m.life < 1.2 ? clamp(m.life / 1.2, 0, 1) : 1;
    const bob = Math.sin(m.wob * 1.6) * 2.5;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.font = `20px ${EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd93d';
    ctx.shadowBlur = 10;
    ctx.fillText('🐝', m.x, m.y + bob);
    ctx.restore();
  }
}

function drawStrikes() {
  for (const s of G.strikes) {
    const p = clamp(1 - s.t / s.maxT, 0, 1);
    ctx.save();
    ctx.fillStyle = `rgba(143,211,255,${0.06 + p * 0.12})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = `rgba(143,211,255,${0.4 + p * 0.5})`;
    ctx.lineWidth = 2 + p * 2;
    ctx.setLineDash([9, 7]);
    ctx.lineDashOffset = -s.t * 90;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = `rgba(200,240,255,${0.25 + p * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.42 + p * 0.3), 0, TAU);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#bfe9ff';
    ctx.font = 'bold 14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⚡', s.x, s.y - s.r - 6);
  }
}

function strokeBoltPath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

function drawTentacles() {
  for (const t of G.tentacles) {
    const o = t.owner, tg = t.target;
    if (!o || !tg) continue;
    const dx = tg.x - o.x, dy = tg.y - o.y;
    const d = Math.hypot(dx, dy) || 1;
    const a = Math.atan2(dy, dx);
    const mx = o.x + dx * 0.5, my = o.y + dy * 0.5;
    const off = Math.sin(o.t * 9 + t.life * 3) * d * 0.13;
    const cx = mx - Math.sin(a) * off, cy = my + Math.cos(a) * off;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowColor = '#ff6ec7';
    ctx.shadowBlur = 16;
    ctx.strokeStyle = 'rgba(255,110,199,0.85)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.quadraticCurveTo(cx, cy, tg.x, tg.y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,205,235,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.quadraticCurveTo(cx, cy, tg.x, tg.y);
    ctx.stroke();

    ctx.fillStyle = '#ffd1ec';
    for (let i = 1; i <= 4; i++) {
      const s = i / 5;
      const qx = (1 - s) * (1 - s) * o.x + 2 * (1 - s) * s * cx + s * s * tg.x;
      const qy = (1 - s) * (1 - s) * o.y + 2 * (1 - s) * s * cy + s * s * tg.y;
      ctx.beginPath();
      ctx.arc(qx, qy, 3.4, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawLasers() {
  const t = performance.now();
  for (const l of G.lasers) {
    const x = l.owner ? l.owner.x : l.x || 0;
    const y = l.owner ? l.owner.y : l.y || 0;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(l.ang);
    ctx.lineCap = 'round';

    if (l.fireT > 0) {
      const k = clamp(1 - l.fireT / 0.8, 0, 1);
      ctx.strokeStyle = `rgba(255,75,62,${0.25 + k * 0.55})`;
      ctx.lineWidth = 1.5 + k * 2;
      ctx.setLineDash([12, 8]);
      ctx.lineDashOffset = -t / 30;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1100, 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowColor = '#ff4b3e';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#ff8f7e';
      ctx.beginPath();
      ctx.arc(0, 0, 6 + k * 15, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#fff2e8';
      ctx.beginPath();
      ctx.arc(0, 0, 3 + k * 6, 0, TAU);
      ctx.fill();
    } else {
      const flick = 0.78 + Math.random() * 0.22;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = flick;
      ctx.shadowColor = '#ff4b3e';
      ctx.shadowBlur = 42;
      ctx.strokeStyle = 'rgba(255,75,62,0.34)';
      ctx.lineWidth = 36;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1100, 0);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,125,95,0.82)';
      ctx.lineWidth = 15;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1100, 0);
      ctx.stroke();

      ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(255,250,245,0.98)';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1100, 0);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.setLineDash([18, 28]);
      ctx.lineDashOffset = -t / 10;
      ctx.strokeStyle = 'rgba(255,225,190,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1100, 0);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,240,225,0.95)';
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawBolts() {
  for (const b of G.bolts) {
    const k = clamp(b.life / b.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = k * (0.7 + Math.random() * 0.3);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = '#8fd3ff';
    ctx.shadowBlur = 26;
    ctx.strokeStyle = 'rgba(120,210,255,0.45)';
    ctx.lineWidth = 10;
    strokeBoltPath(b.pts);
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(248,253,255,0.98)';
    ctx.lineWidth = 2.6;
    strokeBoltPath(b.pts);
    ctx.strokeStyle = 'rgba(190,235,255,0.75)';
    ctx.lineWidth = 1.6;
    for (const br of b.branches) strokeBoltPath(br);
    ctx.shadowBlur = 18;
    ctx.fillStyle = `rgba(210,242,255,${0.55 * k})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 22 * k + 6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawLines() {
  for (const ln of G.lines) {
    const fade = clamp(ln.life / 0.9, 0, 1);
    ctx.save();
    ctx.shadowColor = '#f2d16b';
    ctx.shadowBlur = 14;
    ctx.strokeStyle = `rgba(242,209,107,${0.22 * fade})`;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(ln.x1, ln.y1);
    ctx.lineTo(ln.x2, ln.y2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(245,238,210,${0.7 * fade})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ln.x1, ln.y1);
    ctx.lineTo(ln.x2, ln.y2);
    ctx.stroke();
    ctx.setLineDash([8, 9]);
    ctx.strokeStyle = `rgba(242,209,107,${0.45 * fade})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ln.x1, ln.y1);
    ctx.lineTo(ln.x2, ln.y2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawHoles() {
  for (const f of G.fighters) {
    for (const h of f.holes) {
      const g = ctx.createRadialGradient(h.x, h.y, 2, h.x, h.y, 18);
      g.addColorStop(0, 'rgba(0,0,0,0.92)');
      g.addColorStop(0.7, 'rgba(8,18,10,0.82)');
      g.addColorStop(1, 'rgba(140,233,154,0.16)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(h.x, h.y, 17, 11, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,233,154,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
}

/* 外星人引力奇点 */
function drawWells() {
  const hexa = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };
  for (const w of G.wells) {
    const t = w.life;
    const style = w.style;
    const main = w.color || (style === 'cold' ? '#7fd4ff' : style === 'steam' ? '#cfd6dd' : style === 'toxic' ? '#8fbf5c' : '#8ce99a');
    const accent = w.accent || (style === 'cold' ? '#d9f4ff' : style === 'steam' ? '#ffffff' : style === 'toxic' ? '#c9a4ff' : '#c9a4ff');
    ctx.save();
    const g = ctx.createRadialGradient(w.x, w.y, 6, w.x, w.y, w.r);
    g.addColorStop(0, hexa(main, 0.32));
    g.addColorStop(0.5, hexa(main, 0.16));
    g.addColorStop(1, hexa(main, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, TAU);
    ctx.fill();

    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = -t * 2.6 + i * TAU / 3;
      ctx.strokeStyle = i % 2 ? hexa(accent, 0.8) : hexa(main, 0.85);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r * (0.34 + i * 0.21), a, a + 1.8);
      ctx.stroke();
    }

    ctx.strokeStyle = hexa(main, 0.55);
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 9]);
    ctx.lineDashOffset = -t * 46;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r * (0.92 + Math.sin(t * 10) * 0.03), 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);

    const core = ctx.createRadialGradient(w.x, w.y, 1, w.x, w.y, 24);
    core.addColorStop(0, hexa(accent, 0.95));
    core.addColorStop(0.4, hexa(main, 0.85));
    core.addColorStop(1, hexa(main, 0));
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(w.x, w.y, 24, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* 南瓜地雷 */
function drawMines() {
  for (const m of G.mines) {
    const armed = m.armT <= 0;
    const blink = 0.5 + 0.5 * Math.sin(m.life * 9);
    ctx.save();
    ctx.translate(m.x, m.y);
    if (armed) {
      ctx.strokeStyle = `rgba(255,143,94,${0.16 + 0.2 * blink})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.arc(0, 0, 62, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 36);
      g.addColorStop(0, `rgba(255,217,61,${0.34 + 0.3 * blink})`);
      g.addColorStop(1, 'rgba(255,143,94,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = armed ? 1 : 0.55;
    ctx.font = `26px ${EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎃', 0, -Math.abs(Math.sin(m.life * 4)) * 2);
    ctx.restore();
  }
}

function drawSlashes() {
  for (const s of G.slashes) {
    const p = 1 - s.life / s.maxLife;
    ctx.save();
    ctx.globalAlpha = (1 - p) * 0.9;
    ctx.strokeStyle = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 16;
    ctx.lineWidth = s.width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.72 + p * 0.38), s.a - 0.8, s.a + 0.8);
    ctx.stroke();
    ctx.globalAlpha = (1 - p) * 0.5;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1, s.width * 0.4);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.72 + p * 0.38), s.a - 0.4, s.a + 0.4);
    ctx.stroke();
    ctx.restore();
  }
}

function drawHits() {
  for (const h of G.hits) {
    const p = 1 - h.life / h.maxLife;
    const k = 1 - p;
    const R = (h.heavy ? 54 : 30) * (0.45 + p * 1.5);
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.a);
    ctx.globalAlpha = k * 0.9;
    ctx.strokeStyle = h.color;
    ctx.lineWidth = h.heavy ? 4 : 2.2;
    ctx.lineCap = 'round';
    ctx.shadowColor = h.color;
    ctx.shadowBlur = h.heavy ? 24 : 12;
    for (let i = 0; i < 8; i++) {
      const aa = i * TAU / 8;
      const r2 = R * (i % 2 ? 0.7 : 1);
      ctx.beginPath();
      ctx.moveTo(Math.cos(aa) * R * 0.35, Math.sin(aa) * R * 0.35);
      ctx.lineTo(Math.cos(aa) * r2, Math.sin(aa) * r2);
      ctx.stroke();
    }
    ctx.rotate(-h.a);
    ctx.shadowBlur = h.heavy ? 18 : 8;
    ctx.font = `${h.heavy ? 42 : 30}px ${EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👊', 0, 0);
    ctx.restore();
  }
}

function drawBooms() {
  for (const b of G.booms) {
    const p = 1 - b.life / b.maxLife;
    const k = 1 - p;
    const r = b.r * (0.35 + p * 0.85);
    ctx.save();
    const g = ctx.createRadialGradient(b.x, b.y, r * 0.08, b.x, b.y, r);
    g.addColorStop(0, `rgba(255,250,220,${0.9 * k})`);
    g.addColorStop(0.35, `rgba(255,190,80,${0.8 * k})`);
    g.addColorStop(0.7, `rgba(255,110,40,${0.55 * k})`);
    g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = k * 0.9;
    ctx.strokeStyle = '#ffd9a0';
    ctx.lineWidth = 2 + 4 * k;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r * 1.12, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of G.bullets) {
    ctx.save();
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 15;

    if (b.kind === 'fire') {
      const g2 = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r * 2.2);
      g2.addColorStop(0, '#fff6c0');
      g2.addColorStop(0.35, '#ff9f1c');
      g2.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 2.2, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'laugh') {
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.sin(b.rot) * 0.38);
      ctx.font = `19px ${EMOJI_FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('😂', 0, 0);
    } else if (b.kind === 'sting') {
      const ang = Math.atan2(b.vy, b.vx);
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#b9f6c4';
      ctx.beginPath();
      ctx.moveTo(b.r * 2.2, 0);
      ctx.lineTo(-b.r, b.r * 0.7);
      ctx.lineTo(-b.r * 0.4, 0);
      ctx.lineTo(-b.r, -b.r * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4caf6a';
      ctx.beginPath();
      ctx.arc(-b.r * 0.2, 0, b.r * 0.45, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'rocket') {
      const ang = Math.atan2(b.vy, b.vx);
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(255,150,60,0.85)';
      ctx.beginPath();
      ctx.ellipse(-b.r * 2.2, 0, b.r * 1.9, b.r * 0.5, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath();
      ctx.ellipse(-b.r * 1.2, 0, b.r * 1.1, b.r * 0.45, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#eef3fa';
      ctx.beginPath();
      ctx.ellipse(0, 0, b.r * 1.6, b.r * 0.62, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ff5c3c';
      ctx.beginPath();
      ctx.arc(b.r * 1.45, 0, b.r * 0.38, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'firework') {
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      const cols = ['#ff6ec7', '#ffd93d', '#4dd0ff'];
      for (let i = 0; i < 3; i++) {
        const a = i * TAU / 3;
        ctx.fillStyle = cols[i];
        ctx.beginPath();
        ctx.arc(Math.cos(a) * b.r * 0.7, Math.sin(a) * b.r * 0.7, b.r * 0.55, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.3, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'orb') {
      ctx.shadowColor = '#4dd0ff';
      ctx.shadowBlur = 24;
      ctx.fillStyle = 'rgba(120,220,255,0.9)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#4dd0ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 5 + Math.sin(b.rot * 1.6) * 2, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.98)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.42, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'dynamite') {
      const prog = clamp(1 - b.life / b.life0, 0, 1);
      const lift = Math.sin(prog * Math.PI) * b.lob;
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,0,0,0.33)';
      ctx.beginPath();
      ctx.ellipse(b.x, b.y + 4, b.r * 1.15, b.r * 0.45, 0, 0, TAU);
      ctx.fill();

      ctx.translate(b.x, b.y - lift);
      ctx.rotate(b.rot);
      ctx.shadowColor = '#ff4b3e';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#e63946';
      ctx.fillRect(-b.r * 1.3, -b.r * 0.42, b.r * 2.6, b.r * 0.84);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(-b.r * 1.0, -b.r * 0.32, b.r * 1.3, b.r * 0.15);
      ctx.strokeStyle = '#ffd93d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-b.r * 0.25, -b.r * 0.45);
      ctx.lineTo(-b.r * 0.25, b.r * 0.45);
      ctx.moveTo(b.r * 0.45, -b.r * 0.45);
      ctx.lineTo(b.r * 0.45, b.r * 0.45);
      ctx.stroke();
      ctx.strokeStyle = '#f1f3f5';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(b.r * 1.3, 0);
      ctx.quadraticCurveTo(b.r * 1.8, -b.r * 0.5, b.r * 1.9, -b.r * 0.8);
      ctx.stroke();
      const spark = 2.2 + Math.random() * 2;
      ctx.fillStyle = '#fff6c0';
      ctx.beginPath();
      ctx.arc(b.r * 1.9, -b.r * 0.8, spark, 0, TAU);
      ctx.fill();
      ctx.shadowColor = '#ffd93d';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath();
      ctx.arc(b.r * 1.9, -b.r * 0.8, spark * 0.55, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'slime') {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'bubble') {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.28, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'venom') {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(220,255,230,0.8)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.32, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'bone') {
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.r, -b.r * 0.42, b.r * 2, b.r * 0.84);
      ctx.beginPath();
      ctx.arc(-b.r, 0, b.r * 0.55, 0, TAU);
      ctx.arc(b.r, 0, b.r * 0.55, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'arrow') {
      // 追踪箭：沿速度方向绘制箭头
      const ang = Math.atan2(b.vy, b.vx);
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.shadowBlur = 16;
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.r * 2, -b.r * 0.25, b.r * 2.4, b.r * 0.5);
      ctx.beginPath();
      ctx.moveTo(b.r * 1.6, 0);
      ctx.lineTo(b.r * 0.4, -b.r * 0.7);
      ctx.lineTo(b.r * 0.4, b.r * 0.7);
      ctx.closePath();
      ctx.fill();
      // 尾羽
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-b.r * 2, 0);
      ctx.lineTo(-b.r * 2.6, -b.r * 0.5);
      ctx.lineTo(-b.r * 1.8, 0);
      ctx.closePath();
      ctx.fill();
    } else if (b.kind === 'heart') {
      ctx.font = `21px ${EMOJI_FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💗', b.x, b.y);
    } else if (b.kind === 'zzz') {
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.sin(b.rot) * 0.25);
      ctx.font = `23px ${EMOJI_FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💤', 0, 0);
    } else if (b.kind === 'coin') {
      ctx.translate(b.x, b.y);
      const flip = Math.abs(Math.cos(b.rot * 1.3)) * 0.75 + 0.25;
      ctx.scale(flip, 1);
      const g2 = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, 0.5, 0, 0, b.r);
      g2.addColorStop(0, '#fff6c0');
      g2.addColorStop(0.6, '#ffd93d');
      g2.addColorStop(1, '#d99a00');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#fff3b0';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.62, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#8a5a00';
      ctx.font = 'bold 10px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', 0, 0.5);
    } else if (b.kind === 'tear') {
      const ang = Math.atan2(b.vy, b.vx);
      ctx.translate(b.x, b.y);
      ctx.rotate(ang + Math.PI / 2);
      const g2 = ctx.createRadialGradient(0, -b.r * 0.2, 1, 0, 0, b.r * 1.35);
      g2.addColorStop(0, 'rgba(225,250,255,0.95)');
      g2.addColorStop(0.55, 'rgba(77,208,255,0.88)');
      g2.addColorStop(1, 'rgba(30,120,200,0.08)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(0, -b.r * 1.5);
      ctx.quadraticCurveTo(b.r, -b.r * 0.1, 0, b.r);
      ctx.quadraticCurveTo(-b.r, -b.r * 0.1, 0, -b.r * 1.5);
      ctx.fill();
    } else if (b.kind === 'magic') {
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = 'rgba(201,164,255,0.92)';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * TAU / 8;
        const rr = i % 2 ? b.r * 0.48 : b.r * 1.35;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.36, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'mark') {
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot * 0.6);
      ctx.fillStyle = 'rgba(255,224,102,0.18)';
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,224,102,0.95)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, TAU);
      ctx.stroke();
