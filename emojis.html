      ctx.lineCap = 'round';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(b.r * 0.72, b.r * 0.72);
      ctx.lineTo(b.r * 1.55, b.r * 1.55);
      ctx.stroke();
    } else {
      if (b.kind === 'missile') {
        ctx.shadowBlur = 0;
        for (let i = 0; i < b.trail.length; i++) {
          const t = b.trail[i];
          const a = (i / b.trail.length) * 0.5;
          ctx.fillStyle = `rgba(92,225,166,${a})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, b.r * 0.6 * (i / b.trail.length), 0, TAU);
          ctx.fill();
        }
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 15;
      }
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.42, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawFighters() {
  for (const f of G.fighters) {
    ctx.save();
    ctx.globalAlpha = f.alpha;

    /* 暴怒者天降判定圈（画在地面，位于角色下方） */
    if (f.def.id === 'rage' && f.slamPhase > 0 && !f.dead) {
      const warn = 1 - Math.max(0, f.slamT) / 0.9;
      ctx.save();
      ctx.fillStyle = `rgba(255,75,62,${0.08 + warn * 0.14})`;
      ctx.beginPath();
      ctx.arc(f.slamX, f.slamY, 95, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,75,62,${0.55 + warn * 0.4})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 8]);
      ctx.lineDashOffset = -f.t * 40;
      ctx.beginPath();
      ctx.arc(f.slamX, f.slamY, 95, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(f.slamX - 95, f.slamY);
      ctx.lineTo(f.slamX - 68, f.slamY);
      ctx.moveTo(f.slamX + 68, f.slamY);
      ctx.lineTo(f.slamX + 95, f.slamY);
      ctx.moveTo(f.slamX, f.slamY - 95);
      ctx.lineTo(f.slamX, f.slamY - 68);
      ctx.moveTo(f.slamX, f.slamY + 68);
      ctx.lineTo(f.slamX, f.slamY + 95);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ff8a80';
      ctx.font = 'bold 12px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`天降 ${Math.max(0, f.slamT).toFixed(1)}s`, f.slamX, f.slamY - 108);
    }

    if (!f.dead && f.airH <= 0.02) {
      for (let i = 0; i < f.trail.length; i++) {
        const t = f.trail[i];
        const k = i / f.trail.length;
        ctx.fillStyle = f.def.color;
        ctx.globalAlpha = f.alpha * k * 0.16;
        ctx.beginPath();
        ctx.arc(t.x, t.y, f.size * 0.32 * k, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = f.alpha;
    }

    const airH = f.airH || 0;
    ctx.beginPath();
    ctx.ellipse(f.x, f.y + f.size * 0.47, f.size * (0.4 - airH * 0.15), f.size * (0.14 - airH * 0.04), 0, 0, TAU);
    ctx.fillStyle = `rgba(0,0,0,${0.38 - airH * 0.2})`;
    ctx.fill();

    if (f.hitFlash > 0.02) {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 0.62, 0, TAU);
      ctx.fillStyle = `rgba(255,255,255,${f.hitFlash * 0.55})`;
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 26 * f.hitFlash;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    const airY = f.y - airH * 150;
    if (airH > 0.02) {
      ctx.strokeStyle = 'rgba(255,75,62,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x, airY);
      ctx.stroke();
    }
    /* 神射手蓄力：瞄准虚线 + 蓄力环 */
    if (f.def.id === 'archer' && f.chargeT > 0 && !f.dead) {
      const p = clamp(1 - f.chargeT / 0.65, 0, 1);
      const a = Math.atan2(f.dashY, f.dashX);
      ctx.save();
      ctx.strokeStyle = `rgba(163,217,119,${0.3 + p * 0.5})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 7]);
      ctx.lineDashOffset = -f.t * 60;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x + Math.cos(a) * 240, f.y + Math.sin(a) * 240);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = '#a3d977';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 0.78, -Math.PI / 2, -Math.PI / 2 + TAU * p);
      ctx.stroke();
      ctx.restore();
    }

    ctx.font = `${f.size * (1 + airH * 0.18)}px ${EMOJI_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const glyph = f.frogT > 0 ? '🐸' : f.def.emoji;
    ctx.fillText(glyph, f.x, airY + 1);

    /* 状态提示：标记 / 沉睡 / 魅惑 / 恐惧 */
    if (!f.dead) {
      if (f.markT > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,224,102,0.85)';
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 6]);
        ctx.lineDashOffset = -f.t * 30;
        ctx.beginPath();
        ctx.arc(f.x, airY, f.size * 0.68, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
      if (f.sleepT > 0) {
        ctx.font = `18px ${EMOJI_FONT}`;
        ctx.fillText('💤', f.x + f.size * 0.45, airY - f.size * 0.72 + Math.sin(f.t * 3) * 3);
      } else if (f.charmT > 0) {
        ctx.font = `18px ${EMOJI_FONT}`;
        ctx.fillText('💗', f.x + f.size * 0.45, airY - f.size * 0.62 + Math.sin(f.t * 5) * 2);
      } else if (f.fearT > 0) {
        ctx.font = `17px ${EMOJI_FONT}`;
        ctx.fillText('😱', f.x - f.size * 0.45, airY - f.size * 0.62 + Math.sin(f.t * 9) * 2);
      } else if (f.confuseT > 0) {
        ctx.font = `18px ${EMOJI_FONT}`;
        ctx.fillText('🌀', f.x - f.size * 0.45, airY - f.size * 0.62 + Math.sin(f.t * 7) * 2);
      }
    }

    /* 毒刺钉墙：绿色尖刺与读秒 */
    if (f.pinT > 0 && !f.dead) {
      const ang = Math.atan2(f.pinY - arena.cy, f.pinX - arena.cx);
      ctx.save();
      ctx.shadowColor = '#8ce99a';
      ctx.shadowBlur = 18;
      ctx.strokeStyle = 'rgba(140,233,154,0.95)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x + Math.cos(ang) * f.size * 1.15, f.y + Math.sin(ang) * f.size * 1.15);
      ctx.stroke();
      ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const a2 = ang + Math.PI / 2 + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(f.x, f.y);
        ctx.lineTo(f.x + Math.cos(a2) * f.size * 0.85, f.y + Math.sin(a2) * f.size * 0.85);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(140,233,154,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 0.7, 0, TAU);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#8ce99a';
      ctx.font = 'bold 11px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`钉墙 ${f.pinT.toFixed(1)}s`, f.x, f.y - f.size * 0.75);
    }

    if (f.def.id === 'cool' && !f.dead) {
      for (let i = 0; i < f.orbitCount; i++) {
        const a = f.orbA + i * TAU / f.orbitCount;
        const ox = f.x + Math.cos(a) * f.orbR;
        const oy = f.y + Math.sin(a) * f.orbR;
        ctx.shadowColor = '#4dd0ff';
        ctx.shadowBlur = 16;
        ctx.fillStyle = 'rgba(120,220,255,0.85)';
        ctx.beginPath();
        ctx.arc(ox, oy, 8, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.arc(ox, oy, 3.4, 0, TAU);
        ctx.fill();
      }
    }

    if (f.def.id === 'rage' && f.slamPhase > 0 && !f.dead) {
      const drawY = f.y - f.airH * 150;
      ctx.globalAlpha = 0.75;
      ctx.font = `${f.size * 0.7}px ${EMOJI_FONT}`;
      ctx.fillText('💢', f.x + f.size * 0.6, drawY - f.size * 0.55);
      ctx.globalAlpha = f.alpha;
      /* 下坠速度线 */
      if (f.slamT < 0.35) {
        ctx.strokeStyle = 'rgba(255,75,62,0.55)';
        ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(f.x + i * 12, drawY - f.size * 0.6);
          ctx.lineTo(f.x + i * 16, drawY - f.size * 1.1);
          ctx.stroke();
        }
      }
    }

    if (f.stunT > 0 && !f.dead) {
      const st = performance.now() / 220;
      ctx.shadowColor = '#ffd93d';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffe066';
      for (let i = 0; i < 3; i++) {
        const a = st + i * TAU / 3;
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(a) * f.size * 0.55, f.y - f.size * 0.75 + Math.sin(a) * 7, 2.6, 0, TAU);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    if (f.stickT > 0 && !f.dead) {
      ctx.fillStyle = 'rgba(140,233,154,0.30)';
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + f.size * 0.35, f.size * 0.62, f.size * 0.26, 0, 0, TAU);
      ctx.fill();
      for (let i = 0; i < 4; i++) {
        const a = f.t * 1.5 + i * TAU / 4;
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(a) * f.size * 0.45, f.y + f.size * 0.3 + Math.sin(a) * 5, 3, 0, TAU);
        ctx.fill();
      }
    }

    if (f.poisonT > 0 && !f.dead) {
      ctx.fillStyle = 'rgba(123,216,143,0.6)';
      for (let i = 0; i < 3; i++) {
        const a = f.t * 2.2 + i * TAU / 3;
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(a) * f.size * 0.5, f.y - f.size * 0.5 + Math.sin(a) * 7, 2.2, 0, TAU);
        ctx.fill();
      }
    }

    if (f.onWeb && !f.dead) {
      ctx.strokeStyle = 'rgba(200,182,255,0.7)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + f.size * 0.42, f.size * 0.5, f.size * 0.18, 0, 0, TAU);
      ctx.stroke();
    }

    if (f.def.id === 'cowboy' && f.reloadT > 0 && !f.dead) {
      const p = 1 - f.reloadT / 5;
      ctx.strokeStyle = 'rgba(255,209,102,0.8)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 0.68, -Math.PI / 2, -Math.PI / 2 + p * TAU);
      ctx.stroke();
    }

    if (f.def.id === 'machinegun' && f.mgReload > 0 && !f.dead) {
      const p = 1 - f.mgReload / (f.mgReloadMax || 30);
      ctx.strokeStyle = 'rgba(255,184,77,0.85)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 0.68, -Math.PI / 2, -Math.PI / 2 + p * TAU);
      ctx.stroke();
    }

    if (f.def.id === 'football' && f.chargeT > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,209,102,0.5)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(f.x + f.dashX * f.size * 0.7, f.y + f.dashY * f.size * 0.7);
      ctx.lineTo(f.x + f.dashX * 240, f.y + f.dashY * 240);
      ctx.stroke();
      ctx.restore();
    }

    if (f.def.id === 'fireaxe' && f.axeT > 0) {
      ctx.fillStyle = 'rgba(255,143,94,0.12)';
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.arc(f.x, f.y, 145, f.axeA - 0.9, f.axeA + 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,143,94,0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 145, f.axeA - 0.9, f.axeA + 0.9);
      ctx.stroke();
    }

    // 消防斧追踪加速特效
    if (f.def.id === 'fireaxe' && f.trackBoost > 0 && !f.dead) {
      ctx.globalAlpha = 0.35;
      ctx.font = `${f.size * 0.9}px ${EMOJI_FONT}`;
      ctx.fillText('💨', f.x, f.y - f.size * 0.8);
      ctx.globalAlpha = f.alpha;
    }

    ctx.restore();
  }
}

function drawSmokes() {
  for (const s of G.smokes) {
    const k = clamp(s.life / s.maxLife, 0, 1);
    const g = ctx.createRadialGradient(s.x, s.y, Math.max(1, s.r * 0.08), s.x, s.y, s.r);
    g.addColorStop(0, `hsla(${s.hue}, 45%, 74%, ${0.2 * k})`);
    g.addColorStop(0.55, `hsla(${s.hue}, 35%, 58%, ${0.12 * k})`);
    g.addColorStop(1, `hsla(${s.hue}, 30%, 45%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const k = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    if (p.rect) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillRect(-p.size * 0.5, -p.size * 0.32, p.size, p.size * 0.64);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * k, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const fl of G.floats) {
    const k = Math.max(0, fl.life / fl.maxLife);
    ctx.globalAlpha = k;
    ctx.font = `800 ${fl.size}px system-ui, sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(fl.text, fl.x, fl.y);
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  if (!G.fighters.length) return;
  const barW = Math.min(W * 0.34, 260);
  const barH = 13;
  const y = 18;

  G.fighters.forEach((f, i) => {
    const x = i === 0 ? 18 : W - 18 - barW;
    const p = clamp(f.hp / f.maxHp, 0, 1);

    roundRect(x, y, barW, barH, barH / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.fill();

    ctx.save();
    roundRect(x, y, barW, barH, barH / 2);
    ctx.clip();
    const g2 = ctx.createLinearGradient(x, 0, x + barW, 0);
    g2.addColorStop(0, f.def.color);
    g2.addColorStop(1, i === 0 ? '#ff8fd6' : '#ff8f6b');
    ctx.fillStyle = g2;
    const fillW = barW * p;
    ctx.fillRect(i === 0 ? x : x + barW - fillW, y, fillW, barH);
    ctx.restore();

    roundRect(x, y, barW, barH, barH / 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = '700 13px system-ui, "PingFang SC", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = i === 0 ? 'left' : 'right';
    ctx.fillStyle = '#dfe3f5';
    const nameX = i === 0 ? x + 2 : x + barW - 2;
    ctx.fillText(`${f.def.emoji} ${f.def.name}`, nameX, y + barH + 15);

    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(200,210,235,0.65)';
    ctx.textAlign = i === 0 ? 'right' : 'left';
    ctx.fillText(`${Math.ceil(f.hp)}`, i === 0 ? x + barW - 8 : x + 8, y + barH + 15);

    if (f.shield > 0.5) {
      ctx.font = '700 10.5px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(111,211,255,0.95)';
      ctx.textAlign = i === 0 ? 'right' : 'left';
      ctx.fillText(`🛡 ${Math.ceil(f.shield)}`, i === 0 ? x + barW - 8 : x + 8, y + barH + 31);
    }
  });
}

function drawCenterText(text, color, size, sub) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `900 ${size}px system-ui, "PingFang SC", sans-serif`;
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.strokeText(text, arena.cx, arena.cy);
  ctx.shadowColor = color;
  ctx.shadowBlur = 28;
  ctx.fillStyle = color;
  ctx.fillText(text, arena.cx, arena.cy);
  ctx.shadowBlur = 0;

  if (sub) {
    ctx.font = '600 15px system-ui, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(220,225,245,0.75)';
    ctx.fillText(sub, arena.cx, arena.cy + size * 0.82);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(W / 2, H * 0.42, 20, W / 2, H * 0.42, Math.max(W, H) * 0.75);
  bg.addColorStop(0, 'rgba(40,45,90,0.55)');
  bg.addColorStop(1, 'rgba(4,4,10,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const sh = G.shake;
  ctx.save();
  if (sh > 0.3) ctx.translate(rnd(-sh, sh) * 0.6, rnd(-sh, sh) * 0.6);

  drawArena();
  drawWebs();
  drawAreas();
  drawHoles();
  drawWells();
  drawMines();
  drawLines();
  drawStrikes();
  drawWaves();
  drawBullets();
  drawFighters();
  drawShields();
  drawBolts();
  drawTentacles();
  drawLasers();
  drawMinions();
  drawSlashes();
  drawHits();
  drawBooms();
  drawSmokes();
  drawParticles();
  drawFloats();

  ctx.restore();

  if (G.flash > 0.01) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.32, G.flash * 0.26);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  drawHUD();

  if (G.state === 'countdown') {
    const n = Math.ceil(G.countdown - 0.15);
    if (n > 0) {
      const frac = (G.countdown - 0.15) % 1;
      ctx.globalAlpha = 0.35 + frac * 0.65;
      drawCenterText(String(n), '#8fb4ff', 88);
      ctx.globalAlpha = 1;
    } else {
      drawCenterText('FIGHT!', '#ffd93d', 72);
    }
  } else if (G.state === 'over') {
    const k = Math.min(1, G.overT * 2.4);
    ctx.globalAlpha = k;
    if (G.winner) {
      drawCenterText(`${G.winner.def.emoji} ${G.winner.def.name} 获胜!`, '#ffd93d', Math.min(46, W * 0.105), '点击「再来一局」再战一场');
    }
    ctx.globalAlpha = 1;
  } else if (G.state === 'ready') {
    drawCenterText('八角笼已就绪', '#8fb4ff', 34, '在右侧选择两名选手 → 开始战斗');
  }
}

/* ============================================================
   主循环
============================================================ */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.045, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   UI
============================================================ */
const grid = document.getElementById('grid');
const startBtn = document.getElementById('startBtn');
const randBtn = document.getElementById('randBtn');
const codexList = document.getElementById('codexList');

const mgMask = document.getElementById('mgMask');
const mgInputs = {
  ammo: document.getElementById('mgAmmo'),
  reload: document.getElementById('mgReload'),
  hp: document.getElementById('mgHp'),
  rate: document.getElementById('mgRate')
};
const mgVals = {
  ammo: document.getElementById('mgAmmoVal'),
  reload: document.getElementById('mgReloadVal'),
  hp: document.getElementById('mgHpVal'),
  rate: document.getElementById('mgRateVal')
};

function mgLabel(key, v) {
  if (key === 'ammo') return `${v} 发`;
  if (key === 'reload') return `${v} 秒`;
  if (key === 'rate') return `${v} 发/秒`;
  return `${v}`;
}

function syncMgPanel() {
  for (const key of Object.keys(mgInputs)) {
    mgInputs[key].value = MG_CFG[key];
    mgVals[key].textContent = mgLabel(key, MG_CFG[key]);
  }
}

function openMgPanel() {
  syncMgPanel();
  mgMask.classList.remove('hidden');
}

function closeMgPanel() {
  mgMask.classList.add('hidden');
}

for (const key of Object.keys(mgInputs)) {
  mgInputs[key].addEventListener('input', () => {
    mgVals[key].textContent = mgLabel(key, mgInputs[key].value);
  });
}

document.getElementById('mgApply').addEventListener('click', () => {
  MG_CFG.ammo = clamp(Math.round(+mgInputs.ammo.value), 1, 20000);
  MG_CFG.reload = clamp(+mgInputs.reload.value, 0.5, 60);
  MG_CFG.hp = clamp(Math.round(+mgInputs.hp.value), 40, 5000);
  MG_CFG.rate = clamp(Math.round(+mgInputs.rate.value), 1, 5000);
  closeMgPanel();
  buildCards();
  refreshCards();
  buildCodex();
});

document.getElementById('mgReset').addEventListener('click', () => {
  Object.assign(MG_CFG, MG_DEFAULT);
  syncMgPanel();
  buildCards();
  refreshCards();
  buildCodex();
});

mgMask.addEventListener('click', e => {
  if (e.target === mgMask) closeMgPanel();
});

const heroMask = document.getElementById('heroMask');
const heroInput = document.getElementById('heroRate');
const heroVal = document.getElementById('heroRateVal');

function heroLabel(v) {
  return `${(+v).toFixed(1)} 拳/秒`;
}

function syncHeroPanel() {
  heroInput.value = HERO_CFG.rate;
  heroVal.textContent = heroLabel(HERO_CFG.rate);
}

function openHeroPanel() {
  syncHeroPanel();
  heroMask.classList.remove('hidden');
}

function closeHeroPanel() {
  heroMask.classList.add('hidden');
}

heroInput.addEventListener('input', () => {
  heroVal.textContent = heroLabel(heroInput.value);
});

document.getElementById('heroApply').addEventListener('click', () => {
  HERO_CFG.rate = clamp(+heroInput.value, 1, 100);
  closeHeroPanel();
});

document.getElementById('heroReset').addEventListener('click', () => {
  Object.assign(HERO_CFG, HERO_DEFAULT);
  syncHeroPanel();
});

heroMask.addEventListener('click', e => {
  if (e.target === heroMask) closeHeroPanel();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeMgPanel();
    closeHeroPanel();
  }
});

grid.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (card.dataset.id === 'machinegun') {
    e.preventDefault();
    openMgPanel();
  } else if (card.dataset.id === 'hero') {
    e.preventDefault();
    openHeroPanel();
  }
});

let selected = ['soy', 'rage'];

function buildCodex() {
  codexList.innerHTML = CHARS.filter(c => c.role).map(c => {
    const hp = c.id === 'machinegun' ? MG_CFG.hp : c.hp;
    return `
    <div class="cdx">
      <h4>${c.emoji} ${c.name}<span class="tag">${c.role}</span></h4>
      <p><b>ID</b> ${c.id} ｜ <b>生命</b> ${hp} ｜ <b>攻击</b> ${c.dmg} ｜ <b>速度</b> ${c.speed}</p>
      <p><b>描述</b>：${c.desc}</p>
      <p><b>触发</b>：${c.trigger}</p>
      <p><b>交互</b>：${c.interact}</p>
      <p><b>风格</b>：${c.style}</p>
      <p><b>场景</b>：${c.scenario}</p>
    </div>
  `;
  }).join('');
}

function buildCards() {
  const ordered = [...CHARS].sort((a, b) => (b.group === 'soy') - (a.group === 'soy'));
  grid.innerHTML = ordered.map(c => {
    const hp = c.id === 'machinegun' ? MG_CFG.hp : c.hp;
    return `
    <div class="card" data-id="${c.id}" style="--c:${c.color}" title="${c.desc}">
      ${c.group === 'soy' ? '<div class="grp">黄豆</div>' : ''}
      <div class="emoji">${c.emoji}</div>
      <div class="nm">${c.name}</div>
      <div class="tt">${c.title}</div>
      <div class="st"><span>❤${hp}</span><span>⚔${c.dmg}</span><span>⚡${c.speed}</span></div>
    </div>
  `;
  }).join('');
}

function refreshCards() {
  [...grid.children].forEach(el => {
    const slots = [];
    selected.forEach((id, i) => {
      if (id === el.dataset.id) slots.push(i + 1);
    });
    if (slots.length) {
      el.classList.add('sel');
      el.dataset.slot = slots.join('·');
    } else {
      el.classList.remove('sel');
      delete el.dataset.slot;
    }
  });
  const fighting = (G.state === 'countdown' || G.state === 'fight');
  startBtn.disabled = selected.length !== 2 || fighting;
  if (!fighting) {
    startBtn.textContent = selected.length !== 2
      ? `已选 ${selected.length}/2 名选手`
      : (G.state === 'over' ? '再来一局' : '开始战斗');
  } else {
    startBtn.textContent = '战斗中…';
  }
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (G.state === 'countdown' || G.state === 'fight') return;
  const id = card.dataset.id;
  const count = selected.filter(s => s === id).length;
  if (count === 0) {
    selected.push(id);
    if (selected.length > 2) selected.shift();
  } else if (count === 1) {
    if (selected.length < 2) selected.push(id);
    else selected = [id, id];
  } else {
    selected = selected.filter(s => s !== id);
  }
  refreshCards();
});

startBtn.addEventListener('click', () => {
  if (selected.length !== 2) return;
  startBattle(selected[0], selected[1]);
  refreshCards();
});

randBtn.addEventListener('click', () => {
  const pool = CHARS.map(c => c.id);
  let a = pool[Math.floor(Math.random() * pool.length)];
  let b = pool[Math.floor(Math.random() * pool.length)];
  while (b === a) b = pool[Math.floor(Math.random() * pool.length)];
  selected = [a, b];
  refreshCards();
  startBattle(a, b);
  refreshCards();
});

/* ============================================================
   启动
============================================================ */
buildCards();
buildCodex();
refreshCards();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
