name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # 每日 UTC 00:00（北京时间 08:00）
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'stats.json'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stats and write stats.json
        run: node .github/scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: CodeJ-40404

      - name: Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: update stats.json"
          git push
