<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环球日报 · 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  [hidden] { display: none !important; }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #eef2f6;
    color: #1e2b3c;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .8s ease;
  }

  /* ============ 正常新闻站样式 ============ */
  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .site-header {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-size: 2.5rem;
    color: #0b3b5c;
    font-weight: 800;
    letter-spacing: -.02em;
    transition: color .5s, text-shadow .5s;
  }
  .brand h1 span { font-size: 1.5rem; font-weight: 300; color: #4a6f8a; transition: color .5s; }
  .tagline {
    margin-top: 6px;
    font-size: .68rem;
    letter-spacing: .35em;
    color: #8aa0b4;
  }
  .header-right { text-align: right; }
  .date { font-size: .9rem; color: #5e7a94; margin-bottom: 10px; }
  .search input {
    width: 240px;
    padding: 9px 14px;
    border: 1px solid #cfdae5;
    border-radius: 3px;
    font-size: .9rem;
    outline: none;
    background: #fff;
    color: #1e2b3c;
    transition: border-color .25s, box-shadow .25s, background .4s, color .4s;
  }
  .search input:focus { border-color: #0b3b5c; box-shadow: 0 0 0 3px rgba(11,59,92,.08); }

  .main-nav {
    max-width: 1100px;
    width: 100%;
    margin: 26px auto 0;
    padding: 0 24px 14px;
    display: flex;
    gap: 30px;
    border-bottom: 2px solid #0b3b5c;
    flex-wrap: wrap;
    transition: border-color .5s;
  }
  .main-nav a {
    font-size: 1rem;
    font-weight: 600;
    color: #33506b;
    cursor: pointer;
    padding-bottom: 6px;
    border-bottom: 3px solid transparent;
    transition: color .25s, border-color .25s;
    user-select: none;
  }
  .main-nav a:hover { color: #0a7bbd; }
  .main-nav a.active { color: #0b3b5c; border-bottom-color: #0b3b5c; }

  main {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px 70px;
    flex: 1;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 22px;
  }

  .card {
    position: relative;
    background: #fff;
    border-radius: 4px;
    padding: 22px 24px 18px;
    box-shadow: 0 2px 10px rgba(11,59,92,.06);
    border-top: 3px solid transparent;
    cursor: pointer;
    transition: transform .22s, box-shadow .22s, border-color .22s, background .5s;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(11,59,92,.14);
    border-top-color: #0b3b5c;
  }
  .card-cat {
    font-size: .72rem;
    letter-spacing: .15em;
    color: #7f96ab;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .card .title {
    font-size: 1.25rem;
    line-height: 1.4;
    color: #12344d;
    margin-bottom: 10px;
    transition: color .5s;
  }
  .card .excerpt {
    font-size: .9rem;
    line-height: 1.65;
    color: #5b7185;
    transition: color .5s;
  }
  .card-foot {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    font-size: .75rem;
    color: #93a7b8;
  }
  .read { color: #1e6b9b; font-weight: 600; transition: color .4s; }

  /* ---------- 深红卡片：本身就带着诡异的呼吸感 ---------- */
  .card.crimson {
    border-top-color: #7a0000;
    background: linear-gradient(158deg, #ffffff 0%, #fdf6f6 50%, #f6e4e4 100%);
    animation: crimsonGlow 5.5s ease-in-out infinite;
  }
  @keyframes crimsonGlow {
    0%, 100% { box-shadow: 0 2px 10px rgba(130,0,0,.10); }
    50%      { box-shadow: 0 4px 26px rgba(150,0,0,.34); }
  }
  .card.crimson::after {
    content: "◉";
    position: absolute;
    top: 16px;
    right: 20px;
    color: rgba(150,0,0,.35);
    font-size: 1rem;
    animation: blink 3.4s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .card.crimson .card-cat { color: #a06b6b; }
  .card.crimson .title {
    color: #7c0000;
    letter-spacing: .18em;
    text-shadow: 1px 0 rgba(200,0,0,.18), -1px 0 rgba(0,0,0,.06);
  }
  .card.crimson .title::before {
    content: "▌";
    color: #a80000;
    margin-right: 4px;
    animation: blink 1.7s steps(1) infinite;
  }
  .card.crimson:hover {
    background: linear-gradient(158deg,#fff 0%,#faecec 45%,#f0d4d4 100%);
    border-top-color: #b30000;
  }
  .card.crimson:hover .title { animation: titleShake .16s infinite; }
  @keyframes titleShake {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-1px,1px); }
    50%  { transform: translate(1px,-1px); }
    75%  { transform: translate(-1px,-1px); }
  }
  .card.crimson .excerpt { color: #8a6666; font-style: italic; }
  .card.crimson .read { color: #9c1a1a; }

  .empty {
    text-align: center;
    color: #8aa0b4;
    padding: 60px 0;
    font-size: 1rem;
  }

  /* ---------- 详情页 ---------- */
  #detailView { max-width: 820px; margin: 0 auto; }
  .back-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .95rem;
    color: #1e6b9b;
    font-weight: 600;
    padding: 6px 0;
    margin-bottom: 26px;
    transition: color .4s;
  }
  .back-btn:hover { text-decoration: underline; }
  .detail-cat {
    font-size: .75rem;
    letter-spacing: .18em;
    color: #7f96ab;
    font-weight: 700;
  }
  .detail-title {
    font-size: 2.3rem;
    color: #0b3b5c;
    margin: 12px 0 16px;
    line-height: 1.3;
    transition: color .5s;
  }
  .detail-meta {
    font-size: .82rem;
    color: #93a7b8;
    padding-bottom: 22px;
    border-bottom: 1px solid #dbe4ec;
    margin-bottom: 28px;
  }
  .detail-body p {
    font-size: 1.02rem;
    line-height: 2;
    color: #33475c;
    margin-bottom: 1.4em;
    transition: color .6s;
  }

  /* 深红文章详情：标题剧烈故障闪烁 */
  #detailView.crimson-detail .detail-title {
    color: #8b0000;
    letter-spacing: .25em;
    animation: crimsonTitle 1.1s infinite;
  }
  @keyframes crimsonTitle {
    0%, 100% { transform: translate(0,0); text-shadow: 2px 0 rgba(255,0,0,.7), -2px 0 rgba(0,255,255,.5); }
    33%      { transform: translate(-2px,1px) skewX(2deg); text-shadow: -3px 0 rgba(255,0,0,.85), 3px 0 rgba(0,255,255,.5); }
    66%      { transform: translate(2px,-1px) skewX(-2deg); text-shadow: 3px 0 rgba(255,0,0,.85), -3px 0 rgba(0,255,255,.5); }
  }
  #detailView.crimson-detail .detail-body p { color: #8a3a3a; }
  #detailView.crimson-detail .detail-body p:nth-child(2n) { color: #6e2020; }

  .site-footer {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    border-top: 1px solid #dbe4ec;
    font-size: .8rem;
    color: #93a7b8;
    text-align: center;
    transition: border-color .6s, color .6s;
  }

  /* ============ 恐怖模式：全局氛围 ============ */
  body.hell { background: #060202; }

  body.hell #app { animation: bodyShake .16s infinite; }
  @keyframes bodyShake {
    0%   { transform: translate(0,0); }
    50%  { transform: translate(.7px,-.5px); }
    100% { transform: translate(-.5px,.6px); }
  }
  #app.shake-hard { animation: hardShake .05s infinite !important; }
  @keyframes hardShake {
    0%   { transform: translate(0,0) rotate(0); }
    25%  { transform: translate(-6px,3px) rotate(-.3deg); }
    50%  { transform: translate(5px,-4px) rotate(.3deg); }
    75%  { transform: translate(-3px,-2px) rotate(-.2deg); }
    100% { transform: translate(4px,2px) rotate(.2deg); }
  }

  body.hell .brand h1 { color: #8b0000; text-shadow: 0 0 18px rgba(190,0,0,.9); }
  body.hell .brand h1 span { color: #5e2a2a; }
  body.hell .tagline { color: #6b3a3a; }
  body.hell .date { color: #6b4a4a; }
  body.hell .search input {
    background: #180808;
    border-color: #3a0a0a;
    color: #b07a7a;
  }
  body.hell .main-nav { border-bottom-color: #3a0808; }
  body.hell .main-nav a { color: #9c6b6b; }
  body.hell .main-nav a:hover { color: #ff3b3b; }
  body.hell .main-nav a.active { color: #b30000; border-bottom-color: #b30000; }

  body.hell .card {
    background: #120606;
    border-top-color: #2a0808;
    box-shadow: 0 2px 12px rgba(120,0,0,.25);
  }
  body.hell .card:hover {
    border-top-color: #b30000;
    box-shadow: 0 0 28px rgba(180,0,0,.5);
  }
  body.hell .card .card-cat { color: #6e4a4a; }
  body.hell .card .title { color: #a83a3a; }
  body.hell .card .excerpt { color: #7a5a5a; }
  body.hell .card-foot { color: #6e4a4a; }
  body.hell .read { color: #b30000; }

  body.hell .card.crimson {
    background: linear-gradient(158deg, #1a0505 0%, #2a0a0a 60%, #150303 100%);
    border-top-color: #c00000;
  }
  body.hell .card.crimson .title { color: #ff2b2b; text-shadow: 0 0 12px #b00; }

  body.hell .detail-cat { color: #7a4a4a; }
  body.hell .detail-title { color: #b30000; text-shadow: 0 0 20px rgba(180,0,0,.8); }
  body.hell .detail-meta { color: #6e4a4a; border-bottom-color: #2a0808; }
  body.hell .detail-body p { color: #b09090; }
  body.hell .back-btn { color: #b30000; }
  body.hell .site-footer { border-color: #2a0808; color: #5a3a3a; }
  body.hell .empty { color: #6b3a3a; }

  /* ============ 恐怖覆盖层 ============ */
  #bloodVignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 7800;
    opacity: 0;
    transition: opacity 2.6s ease;
    background:
      radial-gradient(ellipse at 50% 118%, rgba(120,0,0,.55), transparent 62%),
      radial-gradient(ellipse at 50% -18%, rgba(90,0,0,.5), transparent 62%),
      radial-gradient(circle at 50% 50%, transparent 32%, rgba(20,0,0,.8) 100%);
  }
  body.hell #bloodVignette { opacity: 1; }

  #staticCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    pointer-events: none;
    z-index: 8000;
    opacity: 0;
    transition: opacity 1.2s;
    mix-blend-mode: screen;
  }
  body.hell #staticCanvas { opacity: .34; }

  #crackCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 8600;
    opacity: 0;
    transition: opacity 1.4s;
  }
  body.hell #crackCanvas { opacity: 1; }

  #invertLayer {
    position: fixed;
    inset: 0;
    background: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
    opacity: 0;
    z-index: 8900;
    transition: opacity .06s;
  }
  #invertLayer.on { opacity: 1; }

  #faceOverlay {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    background: rgba(0,0,0,.84);
  }
  #faceOverlay.show { opacity: 1; }
  #faceSvg {
    width: 62vmin;
    height: 62vmin;
    filter: drop-shadow(0 0 30px #500);
    transition: transform .1s;
  }

  #glitchBar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9500;
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 6px 0;
    background: rgba(18,0,0,.88);
    color: #a00;
    font-family: monospace;
    font-size: .72rem;
    letter-spacing: .3em;
    pointer-events: none;
    transform: translateY(-110%);
    transition: transform .7s ease;
  }
  body.hell #glitchBar { transform: translateY(0); }

  .blood-drip {
    position: fixed;
    top: -12px;
    background: linear-gradient(to bottom, #3a0000, #8b0000);
    border-radius: 0 0 50% 50%;
    pointer-events: none;
    z-index: 9300;
    animation: dripDown linear forwards;
    box-shadow: 0 0 10px rgba(150,0,0,.7);
  }
  @keyframes dripDown {
    to { transform: translateY(112vh); opacity: .25; }
  }

  .blood-trail {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle, #a00, #400);
    pointer-events: none;
    z-index: 8800;
    transform: translate(-50%, -50%);
    animation: trailFade 1.4s forwards;
    box-shadow: 0 0 8px rgba(150,0,0,.85);
  }
  @keyframes trailFade {
    to { opacity: 0; transform: translate(-50%, 70%) scale(.35); }
  }

  .whisper {
    position: fixed;
    color: rgba(185, 20, 20, .8);
    font-family: monospace;
    letter-spacing: .32em;
    z-index: 9600;
    pointer-events: none;
    text-shadow: 0 0 12px #500;
    animation: whisperFade 1.8s forwards;
  }
  @keyframes whisperFade {
    0%   { opacity: 0; transform: scale(.82); }
    20%  { opacity: 1; transform: scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.12); }
  }

  @media (max-width: 720px) {
    .brand h1 { font-size: 2rem; }
    .brand h1 span { font-size: 1.2rem; }
    .main-nav { gap: 18px; }
    .detail-title { font-size: 1.7rem; }
    .search input { width: 170px; }
  }
</style>
</head>
<body>

<!-- ========== 恐怖覆盖层 ========== -->
<div id="bloodVignette"></div>
<canvas id="staticCanvas"></canvas>
<canvas id="crackCanvas"></canvas>
<div id="invertLayer"></div>

<div id="faceOverlay">
  <svg id="faceSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="eyeGlow">
        <stop offset="0%" stop-color="#ff2b2b"/>
        <stop offset="60%" stop-color="#8b0000"/>
        <stop offset="100%" stop-color="#200000"/>
      </radialGradient>
    </defs>
    <ellipse cx="200" cy="200" rx="150" ry="185" fill="#0a0000" stroke="#3a0000" stroke-width="3"/>
    <ellipse cx="200" cy="200" rx="150" ry="185" fill="none" stroke="#1a0000" stroke-width="12" opacity=".6"/>
    <ellipse cx="138" cy="165" rx="34" ry="22" fill="url(#eyeGlow)"/>
    <ellipse cx="138" cy="165" rx="10" ry="16" fill="#000"/>
    <ellipse cx="262" cy="165" rx="34" ry="22" fill="url(#eyeGlow)"/>
    <ellipse cx="262" cy="165" rx="10" ry="16" fill="#000"/>
    <path d="M138 187 Q140 232 132 262" stroke="#500" stroke-width="5" fill="none" opacity=".75"/>
    <path d="M262 187 Q258 242 268 278" stroke="#500" stroke-width="4" fill="none" opacity=".75"/>
    <path d="M120 265 Q200 400 280 265 Q200 320 120 265 Z" fill="#120000" stroke="#4a0000" stroke-width="3"/>
    <path d="M150 290 L160 320 L170 292 M195 300 L200 338 L205 300 M230 292 L240 320 L250 290"
          stroke="#300" stroke-width="4" fill="none"/>
  </svg>
</div>

<div id="glitchBar">
  <span>不要看</span><span>·</span><span>太迟了</span><span>·</span><span>它在看着你</span>
</div>

<!-- ========== 新闻主体 ========== -->
<div id="app">
  <header class="site-header">
    <div class="brand">
      <h1>环球<span>日报</span></h1>
      <div class="tagline">GLOBAL DAILY · 真实 · 客观 · 公正</div>
    </div>
    <div class="header-right">
      <div class="date">2025年3月17日 星期一 农历二月十八</div>
      <div class="search">
        <input id="searchInput" type="text" placeholder="搜索新闻...">
      </div>
    </div>
  </header>

  <nav class="main-nav" id="mainNav">
    <a data-cat="all" class="active">首页</a>
    <a data-cat="要闻">要闻</a>
    <a data-cat="国际">国际</a>
    <a data-cat="财经">财经</a>
    <a data-cat="科技">科技</a>
    <a data-cat="体育">体育</a>
    <a data-cat="文化">文化</a>
  </nav>

  <main>
    <section id="listView">
      <div class="grid" id="articleGrid"></div>
      <div class="empty" id="emptyTip" hidden>没有找到相关文章</div>
    </section>

    <section id="detailView" hidden>
      <button class="back-btn" id="backBtn">← 返回列表</button>
      <article class="article-detail">
        <div class="detail-cat" id="detailCat"></div>
        <h1 class="detail-title" id="detailTitle"></h1>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-body" id="detailBody"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    © 2025 环球日报社 · 未经许可不得转载 · 互联网新闻信息服务许可证 10120250001
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ========================================================
     一、文章数据（“深红”藏在第八篇）
     ======================================================== */
  const ARTICLES = [
    {
      id: 'a1', category: '财经',
      title: '央行宣布下调存款准备金率0.25个百分点',
      date: '2025-03-17',
      excerpt: '为支持实体经济发展，促进综合融资成本稳中有降，中国人民银行决定于2025年3月20日下调金融机构存款准备金率0.25个百分点。',
      body: '<p>中国人民银行今日发布公告，为支持实体经济发展，促进综合融资成本稳中有降，决定于2025年3月20日下调金融机构存款准备金率0.25个百分点（不含已执行5%存款准备金率的金融机构）。</p><p>本次下调后，金融机构加权平均存款准备金率约为6.6%。市场分析人士认为，此次降准将释放长期资金约5000亿元，有助于保持流动性合理充裕，降低社会综合融资成本。</p><p>央行有关负责人表示，将继续实施稳健的货币政策，保持流动性合理充裕，引导金融机构加大对实体经济特别是小微企业、科技创新、绿色发展的支持力度。</p>'
    },
    {
      id: 'a2', category: '科技',
      title: '新一代量子计算机原型机“九章三号”问世',
      date: '2025-03-17',
      excerpt: '我国量子计算研究再获重大突破，成功构建255个光子的量子计算原型机，求解高斯玻色取样问题的速度比超级计算机快亿亿倍。',
      body: '<p>记者从中国科学技术大学获悉，该校潘建伟院士团队与多家单位合作，成功构建了255个光子的量子计算原型机“九章三号”，再度刷新光量子信息技术世界纪录。</p><p>实验结果显示，“九章三号”处理高斯玻色取样的速度比目前全球最快的超级计算机快一亿亿倍，在研制量子计算机的道路上迈出重要一步。</p><p>相关成果已发表于国际权威学术期刊。专家表示，量子计算在密码分析、药物研发、气象预报等领域具有广阔应用前景。</p>'
    },
    {
      id: 'a3', category: '国际',
      title: '全球气候峰会达成历史性协议',

  /* ========================================================

  const app         = document.getElementById('app');

  const listView    = document.getElementById('listView');
  const detailView  = document.getElementById('detailView');
  const detailTitle = document.getElementById('detailTitle');
  const detailCat   = document.getElementById('detailCat');
  const detailMeta  = document.getElementById('detailMeta');
  const detailBody  = document.getElementById('detailBody');
  const backBtn     = document.getElementById('backBtn');
  const searchInput = document.getElementById('searchInput');
  const mainNav     = document.getElementById('mainNav');

  const state = { category: 'all', keyword: '' };

  function cardHTML(a) {
    return (
      '<article class="card' + (a.crimson ? ' crimson' : '') + '" data-id="' + a.id + '">' +
        '<div class="card-cat">' + a.category + '</div>' +
        '<h2 class="title">' + a.title + '</h2>' +
        '<p class="excerpt">' + a.excerpt + '</p>' +
        '<div class="card-foot"><span>' + a.date + '</span><span class="read">阅读全文 →</span></div>' +
      '</article>'
    );
  }

  function renderArticles() {
    const kw = state.keyword.trim().toLowerCase();
    const list = ARTICLES.filter(function (a) {
      const okCat = state.category === 'all' || a.category === state.category;
      const okKw = !kw || (a.title + a.excerpt).toLowerCase().indexOf(kw) !== -1;
      return okCat && okKw;
    });

    grid.innerHTML = list.map(cardHTML).join('');
    emptyTip.hidden = list.length > 0;

    grid.querySelectorAll('.card').forEach(function (el) {
      el.addEventListener('click', function () {
        openDetail(el.dataset.id);
      });
    });
  }

  /* ========================================================
     三、详情页
     ======================================================== */
  function openDetail(id) {
    const a = ARTICLES.find(function (x) { return x.id === id; });
    if (!a) return;

    detailCat.textContent   = a.category;
    detailTitle.textContent = a.title;
    detailMeta.textContent  = a.date + ' · 环球日报 · 记者 佚名';
    detailBody.innerHTML    = a.body;

    detailView.classList.toggle('crimson-detail', !!a.crimson);
    listView.hidden = true;
    detailView.hidden = false;
    window.scrollTo(0, 0);

    if (a.crimson) {
      // 给读者 1.5 秒阅读“深红”正文，然后世界崩塌
      setTimeout(function () { Hell.start(); }, 1500);
    }
  }

  backBtn.addEventListener('click', function () {
    detailView.hidden = true;
    listView.hidden = false;
    detailView.classList.remove('crimson-detail');
    renderArticles();
    window.scrollTo(0, 0);
  });

  /* 导航 & 搜索 */
  mainNav.addEventListener('click', function (e) {
    const link = e.target.closest('a[data-cat]');
    if (!link) return;
    mainNav.querySelectorAll('a').forEach(function (x) { x.classList.remove('active'); });
    link.classList.add('active');
    state.category = link.dataset.cat;
    renderArticles();
  });

  searchInput.addEventListener('input', function () {
    state.keyword = searchInput.value;
    if (!detailView.hidden) {
      detailView.hidden = true;
      listView.hidden = false;
      detailView.classList.remove('crimson-detail');
    }
    renderArticles();
  });

  /* ========================================================
     四、恐怖引擎 Hell
     ======================================================== */
  const Hell = {
    started: false,
    timers: [],
    staticRAF: null,
    crackCtx: null,
    staticCtx: null,
    crackCanvas: null,
    staticCanvas: null,
    faceOverlay: null,
    faceSvg: null,
    invertLayer: null,

    init: function () {
      this.crackCanvas  = document.getElementById('crackCanvas');
      this.staticCanvas = document.getElementById('staticCanvas');
      this.faceOverlay  = document.getElementById('faceOverlay');
      this.faceSvg      = document.getElementById('faceSvg');
      this.invertLayer  = document.getElementById('invertLayer');

      this.crackCtx  = this.crackCanvas.getContext('2d');
      this.staticCtx = this.staticCanvas.getContext('2d');

      this.staticCanvas.width  = 160;
      this.staticCanvas.height = 90;

      this.resizeCracks();
      const self = this;
      window.addEventListener('resize', function () { self.resizeCracks(); });
    },

    resizeCracks: function () {
      this.crackCanvas.width  = window.innerWidth;
      this.crackCanvas.height = window.innerHeight;
      if (this.started) this.drawCracks();
    },

    /* ---------- 启动 ---------- */
    start: function () {
      if (this.started) return;
      this.started = true;

      document.body.classList.add('hell');
      document.title = '⚠ 深 红 ⚠';

      this.drawCracks();
      this.startStatic();
      this.startAudio();
      this.startTextCorruption();
      this.startRandomEvents();
      this.startCrackGrowth();
      this.startTitleFlicker();
      this.bindMouseTrail();
    },

    /* ---------- 裂纹绘制 ---------- */
    drawCracks: function () {
      const ctx = this.crackCtx;
      const w = this.crackCanvas.width;
      const h = this.crackCanvas.height;

      ctx.clearRect(0, 0, w, h);

      const centers = [
        { x: w * 0.28, y: h * 0.35 },
        { x: w * 0.72, y: h * 0.62 },
        { x: w * 0.50, y: h * 0.16 },
        { x: w * 0.84, y: h * 0.84 },
        { x: w * 0.14, y: h * 0.78 }
      ];
      const self = this;
      centers.forEach(function (c) {
        self.burstCracks(c.x, c.y, 10 + Math.floor(Math.random() * 6));
      });

      for (let i = 0; i < 140; i++) this.randomCrackLine();

      // 暗角
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.2, w / 2, h / 2, Math.max(w, h) * 0.78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(25,0,0,.55)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    },

    burstCracks: function (cx, cy, n) {
      const ctx = this.crackCtx;
      const w = this.crackCanvas.width;
      const h = this.crackCanvas.height;

      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + Math.random() * 0.4;
        const len = Math.min(w, h) * (0.25 + Math.random() * 0.6);
        const segs = 3 + Math.floor(Math.random() * 3);

        let x = cx, y = cy;
        let curAng = ang;

        ctx.beginPath();
        ctx.moveTo(x, y);

        for (let s = 0; s < segs; s++) {
          curAng += (Math.random() - 0.5) * 0.6;
          const step = len / segs;
          x += Math.cos(curAng) * step;
          y += Math.sin(curAng) * step;
          ctx.lineTo(x, y);
        }

        ctx.strokeStyle = 'rgba(255,235,235,' + (0.45 + Math.random() * 0.4) + ')';
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.shadowColor = 'rgba(180,0,0,.9)';
        ctx.shadowBlur = 12;
        ctx.stroke();

        if (Math.random() > 0.4) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          const a2 = curAng + (Math.random() - 0.5) * 1.4;
          const l2 = len * (0.2 + Math.random() * 0.3);
          ctx.lineTo(x + Math.cos(a2) * l2, y + Math.sin(a2) * l2);
          ctx.strokeStyle = 'rgba(255,210,210,' + (0.3 + Math.random() * 0.35) + ')';
          ctx.lineWidth = 0.8 + Math.random() * 1.2;
          ctx.stroke();
        }
      }
      ctx.shadowBlur = 0;
    },

    randomCrackLine: function () {
      const ctx = this.crackCtx;
      const w = this.crackCanvas.width;
      const h = this.crackCanvas.height;

      const sx = Math.random() * w;
      const sy = Math.random() * h;
      const ang = Math.random() * Math.PI * 2;
      const len = 12 + Math.random() * 90;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ang) * len, sy + Math.sin(ang) * len);
      ctx.strokeStyle = 'rgba(230,200,200,' + (0.12 + Math.random() * 0.35) + ')';
      ctx.lineWidth = 0.6 + Math.random() * 1.6;
      ctx.stroke();
    },

    startCrackGrowth: function () {
      const self = this;
      function grow() {
        if (!self.started) return;
        const w = self.crackCanvas.width;
        const h = self.crackCanvas.height;
        for (let i = 0; i < 3; i++) self.randomCrackLine();
        if (Math.random() > 0.5) {
          self.burstCracks(Math.random() * w, Math.random() * h, 4 + Math.floor(Math.random() * 5));
        }
        self.timers.push(setTimeout(grow, 2500 + Math.random() * 3000));
      }
      this.timers.push(setTimeout(grow, 3000));
    },

    /* ---------- 噪点干扰 ---------- */
    startStatic: function () {
      const c   = this.staticCanvas;
      const ctx = this.staticCtx;
      const w   = c.width;
      const h   = c.height;
      const img  = ctx.createImageData(w, h);
      const data = img.data;
      let last = 0;
      const self = this;

      function frame(t) {
        if (t - last > 45) {
          last = t;
          for (let i = 0; i < data.length; i += 4) {
            const v = Math.random() * 255;
            data[i]     = v;                // R
            data[i + 1] = v * 0.15;         // G
            data[i + 2] = v * 0.25;         // B
            data[i + 3] = Math.random() * 110; // A
          }
          ctx.putImageData(img, 0, 0);
        }
        self.staticRAF = requestAnimationFrame(frame);
      }
      this.staticRAF = requestAnimationFrame(frame);
    },

    /* ---------- 低频环境音 ---------- */
    startAudio: function () {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        if (ctx.state === 'suspended') ctx.resume();

        // 低频嗡嗡声
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 48;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

        // 第二层低频
        const osc2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc2.type = 'sawtooth';
        osc2.frequency.value = 31;
        filter.type = 'lowpass';
        filter.frequency.value = 180;
        g2.gain.value = 0.015;
        osc2.connect(filter);
        filter.connect(g2);
        g2.connect(ctx.destination);
        osc2.start();

        // 白噪声
        const bufferSize = Math.floor(ctx.sampleRate * 2);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const ch = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) ch[i] = (Math.random() * 2 - 1) * 0.3;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const ng = ctx.createGain();
        ng.gain.value = 0.012;
        const nf = ctx.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.value = 800;

        noise.connect(nf);
        nf.connect(ng);
        ng.connect(ctx.destination);
        noise.start();
      } catch (e) { /* 忽略音频错误 */ }
    },

    /* ---------- 文字腐化 ---------- */
    startTextCorruption: function () {
      const GARBAGE = '▓▒░█▚▞◣◢◤◥⛧†‡勿看血它来了不要回头HELP';
      const self = this;

      function corrupt(el) {
        if (!el.dataset.orig) el.dataset.orig = el.textContent;
        const orig = el.dataset.orig;
        let out = '';
        for (let i = 0; i < orig.length; i++) {
          if (orig[i] === ' ') { out += ' '; continue; }
          out += Math.random() < 0.4
            ? GARBAGE.charAt(Math.floor(Math.random() * GARBAGE.length))
            : orig[i];
        }
        el.textContent = out;
      }

      function restore(el) {
        if (el.dataset && el.dataset.orig) el.textContent = el.dataset.orig;
      }

      function tick() {
        if (!self.started) return;
        const els = Array.prototype.slice.call(
          document.querySelectorAll('.card .title, .detail-title')
        );
        if (els.length) {
          const picked = els.filter(function () { return Math.random() < 0.35; });
          picked.forEach(corrupt);
          setTimeout(function () { picked.forEach(restore); }, 500 + Math.random() * 900);
        }
        self.timers.push(setTimeout(tick, 1800 + Math.random() * 2200));
      }
      this.timers.push(setTimeout(tick, 2000));
    },

    corruptBurst: function () {
      const GARBAGE = '▓▒░█▚▞◣◢⛧勿看血它来了不要回头HELP';
      const els = document.querySelectorAll('.card .title, .detail-title');
      els.forEach(function (el) {
        if (!el.dataset.orig) el.dataset.orig = el.textContent;
        const orig = el.dataset.orig;
        let out = '';
        for (let i = 0; i < orig.length; i++) {
          out += Math.random() < 0.7
            ? GARBAGE.charAt(Math.floor(Math.random() * GARBAGE.length))
            : orig[i];
        }
        el.textContent = out;
        setTimeout(function () {
          if (el.dataset && el.dataset.orig) el.textContent = el.dataset.orig;
        }, 260);
      });
    },

    /* ---------- 随机恐怖事件 ---------- */
    startRandomEvents: function () {
      const self = this;
      function trigger() {
        if (!self.started) return;
        const r = Math.random();
        if (r < 0.22)      self.flashFace();
        else if (r < 0.38) self.invertFlash();
        else if (r < 0.55) self.hardShake();
        else if (r < 0.72) self.bloodDrip(2 + Math.floor(Math.random() * 3));
        else if (r < 0.86) self.corruptBurst();
        else               self.spawnWhisper();

        self.timers.push(setTimeout(trigger, 2200 + Math.random() * 4500));
      }
      this.timers.push(setTimeout(trigger, 2500));
    },

    flashFace: function () {
      const ov  = this.faceOverlay;
      const svg = this.faceSvg;
      svg.style.transform = 'rotate(' + ((Math.random() - 0.5) * 20) + 'deg) scale(' + (0.85 + Math.random() * 0.6) + ')';
      svg.style.filter = 'drop-shadow(0 0 ' + (20 + Math.random() * 40) + 'px #700) hue-rotate(' + (Math.random() * 40) + 'deg)';
      ov.classList.add('show');
      setTimeout(function () { ov.classList.remove('show'); }, 120 + Math.random() * 320);
    },

    invertFlash: function () {
      const layer = this.invertLayer;
      layer.classList.add('on');
      setTimeout(function () { layer.classList.remove('on'); }, 80);
    },

    hardShake: function () {
      app.classList.add('shake-hard');
      setTimeout(function () { app.classList.remove('shake-hard'); }, 420);
    },

    bloodDrip: function (n) {
      n = n || 2;
      for (let i = 0; i < n; i++) {
        const d = document.createElement('div');
        d.className = 'blood-drip';
        d.style.left = (5 + Math.random() * 90) + 'vw';
        d.style.height = (40 + Math.random() * 140) + 'px';
        d.style.width = (3 + Math.random() * 6) + 'px';
        d.style.animationDuration = (1.4 + Math.random() * 1.8) + 's';
        document.body.appendChild(d);
        setTimeout(function () { d.remove(); }, 4200);
      }
    },

    spawnWhisper: function () {
      const words = ['别回头', '它在看着你', '你身后有人', '不要眨眼', '已经太迟了', 'HELP ME', '深红', '关掉它'];
      const el = document.createElement('div');
      el.className = 'whisper';
      el.textContent = words[Math.floor(Math.random() * words.length)];
      el.style.left = (8 + Math.random() * 76) + 'vw';
      el.style.top  = (10 + Math.random() * 72) + 'vh';
      el.style.fontSize = (14 + Math.random() * 26) + 'px';
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 2000);
    },

    /* ---------- 鼠标血迹 ---------- */
    bindMouseTrail: function () {
      const self = this;
      let last = 0;
      document.addEventListener('mousemove', function (e) {
        if (!self.started) return;
        const now = performance.now();
        if (now - last < 55) return;
        last = now;

        const b = document.createElement('div');
        b.className = 'blood-trail';
        const s = 3 + Math.random() * 9;
        b.style.width  = s + 'px';
        b.style.height = s + 'px';
        b.style.left = e.clientX + 'px';
        b.style.top  = e.clientY + 'px';
        document.body.appendChild(b);
        setTimeout(function () { b.remove(); }, 1500);
      });
    },

    /* ---------- 浏览器标签标题闪烁 ---------- */
    startTitleFlicker: function () {
      const titles = ['⚠ 深 红 ⚠', '不要看', '它在你身后', '太迟了', '▓▒░█', 'HELP'];
      let i = 0;
      const self = this;
      function tick() {
        if (!self.started) return;
        i = (i + 1) % titles.length;
        document.title = titles[i];
        self.timers.push(setTimeout(tick, 1200 + Math.random() * 1500));
      }
      this.timers.push(setTimeout(tick, 800));
    }
  };

  /* ========================================================
     五、初始化
     ======================================================== */
  Hell.init();
  renderArticles();

})();
</script>
</body>
</html>
